<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StayGrid — Hostel &amp; PG Management Platform</title>
    <meta
      name="description"
      content="Interactive Hostel & PG Management platform with floor-by-floor 2D room builders, live occupancy analytics, and tenant discovery."
    />
    <meta property="og:title" content="StayGrid — Hostel & PG Management Platform" />
    <meta
      property="og:description"
      content="Interactive Hostel & PG Management platform with floor-by-floor 2D room builders, live occupancy analytics, and tenant discovery."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Curated Google Fonts: Plus Jakarta Sans, DM Sans, JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Tailwind CSS via CDN (Zero-build: runs directly in any browser or VS Code Live Server) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              display: ['"Plus Jakarta Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              sans: ['"DM Sans"', 'ui-sans-serif', 'system-ui', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'ui-monospace', 'SFMono-Regular', 'monospace'],
            },
            colors: {
              navy: {
                950: '#031026',
                900: '#061A3A',
                800: '#0A2550',
                700: '#10356B',
              },
              indigo: {
                50: '#ECFEFF',
                100: '#CFFAFE',
                200: '#A5F3FC',
                300: '#67E8F9',
                400: '#22D3EE',
                500: '#00C2F3',
                600: '#0284C7',
                700: '#0369A1',
                800: '#07406B',
                900: '#061A3A',
                950: '#031026',
              },
            },
          },
        },
      };
    </script>

    <!-- Chart.js via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>

    <!-- Prevent theme flash on initial load -->
    <script>
      try {
        if (localStorage.getItem('staygrid_theme_v1') === 'dark') {
          document.documentElement.classList.add('theme-dark');
        }
      } catch {}
    </script>

    <style>
      html {
        font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif;
        scroll-behavior: smooth;
      }
      h1, h2, h3, h4, .font-display {
        font-family: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
      }
      .tabular-nums {
        font-variant-numeric: tabular-nums;
      }
      @keyframes modalFadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes modalSlideUp {
        from { opacity: 0; transform: translateY(10px) scale(0.985); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      @keyframes toastSlideIn {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }

      /* Welcome Splash — Inner Effect (Entrance) & Outer Effect (Exit) */
      @keyframes welcomeBackdropIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes welcomeBackdropOut {
        from { opacity: 1; }
        to { opacity: 0; }
      }
      @keyframes welcomeCardIn {
        0% {
          opacity: 0;
          transform: scale(0.84) translateY(18px);
          filter: brightness(0.65);
        }
        100% {
          opacity: 1;
          transform: scale(1) translateY(0);
          filter: brightness(1);
        }
      }
      @keyframes welcomeImageInner {
        0% {
          transform: scale(1.13);
        }
        100% {
          transform: scale(1);
        }
      }
      @keyframes welcomeInnerSheen {
        0% {
          opacity: 0;
          transform: translateX(-140%) skewX(-22deg);
        }
        25% {
          opacity: 0.7;
        }
        100% {
          opacity: 0;
          transform: translateX(240%) skewX(-22deg);
        }
      }
      @keyframes welcomeOuterAura {
        0%, 100% {
          opacity: 0.55;
          transform: scale(0.96);
        }
        50% {
          opacity: 0.9;
          transform: scale(1.04);
        }
      }
      @keyframes welcomeCardOut {
        0% {
          opacity: 1;
          transform: scale(1);
          filter: blur(0px);
        }
        100% {
          opacity: 0;
          transform: scale(1.11);
          filter: blur(8px);
        }
      }
      @keyframes welcomeOuterRipple {
        0% {
          opacity: 0.75;
          transform: scale(0.98);
        }
        100% {
          opacity: 0;
          transform: scale(1.24);
        }
      }
      @keyframes welcomeProgressFill {
        from { transform: scaleX(0); }
        to { transform: scaleX(1); }
      }
      @keyframes appSurfaceReveal {
        0% {
          opacity: 0.85;
          transform: scale(0.985);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

      .welcome-splash-overlay {
        animation: welcomeBackdropIn 420ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .welcome-splash-overlay .welcome-outer-aura {
        animation: welcomeOuterAura 2.6s ease-in-out infinite;
      }
      .welcome-splash-overlay .welcome-card-frame {
        animation: welcomeCardIn 850ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .welcome-splash-overlay .welcome-inner-img {
        animation: welcomeImageInner 1.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .welcome-splash-overlay .welcome-inner-sheen {
        animation: welcomeInnerSheen 1.45s cubic-bezier(0.22, 1, 0.36, 1) 420ms forwards;
      }
      .welcome-splash-overlay .welcome-progress-bar {
        transform-origin: left center;
        animation: welcomeProgressFill 2.8s linear forwards;
      }

      /* Outer exit transition state */
      .welcome-splash-overlay.is-exiting {
        pointer-events: none;
        animation: welcomeBackdropOut 740ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      .welcome-splash-overlay.is-exiting .welcome-card-frame {
        animation: welcomeCardOut 680ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      .welcome-splash-overlay.is-exiting .welcome-outer-ring {
        animation: welcomeOuterRipple 700ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .app-reveal-settle {
        animation: appSurfaceReveal 620ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      .animate-modal-backdrop {
        animation: modalFadeIn 160ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .animate-modal-panel {
        animation: modalSlideUp 190ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      .animate-toast {
        animation: toastSlideIn 190ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* StayGrid Midnight Navy + Electric Neon Cyan Theme Effects */
      .neon-header {
        background: linear-gradient(90deg, #041229 0%, #071E44 50%, #041531 100%);
        border-bottom: 1px solid rgba(34, 211, 238, 0.32);
        box-shadow: 0 1px 0 rgba(0, 212, 255, 0.28), 0 10px 30px rgba(3, 16, 38, 0.22);
      }
      .neon-text-cyan {
        color: #00C8F8;
        text-shadow: 0 0 18px rgba(0, 212, 255, 0.38);
      }
      .neon-brand-glow {
        color: #22D3EE;
        text-shadow: 0 0 14px rgba(34, 211, 238, 0.55);
      }
      .neon-cyan-btn {
        background: linear-gradient(135deg, #22D3EE 0%, #00B8EE 100%);
        color: #04142E;
        box-shadow: 0 0 0 1px rgba(103, 232, 249, 0.55), 0 6px 22px rgba(0, 194, 243, 0.36);
        transition: transform 160ms cubic-bezier(0.16, 1, 0.3, 1), box-shadow 160ms ease, filter 160ms ease;
      }
      .neon-cyan-btn:hover {
        filter: brightness(1.06);
        box-shadow: 0 0 0 1px rgba(165, 243, 252, 0.85), 0 8px 28px rgba(0, 212, 255, 0.55);
      }
      .neon-navy-btn {
        background: linear-gradient(135deg, #071E44 0%, #0A2B5E 100%);
        color: #FFFFFF;
        box-shadow: 0 0 0 1px rgba(34, 211, 238, 0.32), 0 8px 20px rgba(6, 26, 58, 0.25);
        transition: transform 160ms cubic-bezier(0.16, 1, 0.3, 1), box-shadow 160ms ease;
      }
      .neon-navy-btn:hover {
        box-shadow: 0 0 0 1px rgba(34, 211, 238, 0.72), 0 8px 26px rgba(0, 212, 255, 0.32);
      }
      .neon-card {
        border: 1px solid rgba(14, 165, 233, 0.16);
        box-shadow: 0 4px 20px rgba(6, 26, 58, 0.05);
        transition: border-color 180ms ease, box-shadow 180ms ease, transform 180ms cubic-bezier(0.16, 1, 0.3, 1);
      }
      .neon-card:hover {
        border-color: rgba(0, 212, 255, 0.55);
        box-shadow: 0 0 0 1px rgba(34, 211, 238, 0.25), 0 12px 30px rgba(0, 194, 243, 0.16);
      }
      .neon-search-dock {
        border: 1px solid rgba(34, 211, 238, 0.34);
        box-shadow: 0 14px 36px rgba(6, 26, 58, 0.11), 0 0 22px rgba(0, 212, 255, 0.12);
      }
      .neon-hero-slash {
        background: linear-gradient(180deg, #22D3EE 0%, #00B4E6 60%, #0284C7 100%);
        box-shadow: 0 0 28px rgba(0, 212, 255, 0.55);
      }
      .neon-dark-banner {
        background: radial-gradient(circle at 82% 20%, rgba(0, 212, 255, 0.18), transparent 48%),
          linear-gradient(115deg, #04132B 0%, #072047 58%, #041430 100%);
        border: 1px solid rgba(34, 211, 238, 0.32);
        box-shadow: 0 16px 40px rgba(4, 18, 41, 0.26), inset 0 1px 0 rgba(103, 232, 249, 0.22);
      }
      .staygrid-page-bg {
        position: relative;
        background-color: #F4EFE8;
      }
      html:not(.theme-dark) body.staygrid-page-bg::before {
        content: "";
        position: fixed;
        inset: -24px;
        z-index: -2;
        pointer-events: none;
        background-image: url('/assets/aistudio/images_fe88c14b.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: no-repeat;
        filter: blur(10px) saturate(1.06);
        transform: scale(1.04);
      }
      html:not(.theme-dark) body.staygrid-page-bg::after {
        content: "";
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        background:
          radial-gradient(circle at 12% 0%, rgba(0, 212, 255, 0.08), transparent 38%),
          linear-gradient(180deg, rgba(255, 251, 246, 0.46) 0%, rgba(244, 248, 252, 0.56) 100%);
      }
      html:not(.theme-dark) #main-content .bg-white {
        background-color: rgba(255, 255, 255, 0.88);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
      }

      /* Tactile Click Room Animation (Shared by Tenants & Landlords) */
      @keyframes roomBoxClickPop {
        0% {
          transform: scale(1);
        }
        32% {
          transform: scale(0.93);
        }
        68% {
          transform: scale(1.045);
        }
        100% {
          transform: scale(1);
        }
      }
      @keyframes roomClickRippleWave {
        0% {
          transform: translate(-50%, -50%) scale(0);
          opacity: 0.72;
        }
        100% {
          transform: translate(-50%, -50%) scale(2.8);
          opacity: 0;
        }
      }
      .room-tile {
        position: relative;
        overflow: hidden;
        will-change: transform;
      }
      .room-tile-clicking {
        z-index: 10;
        animation: roomBoxClickPop 240ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
        box-shadow: 0 0 0 2px rgba(0, 212, 255, 0.78), 0 0 24px rgba(0, 212, 255, 0.42) !important;
      }
      .room-tile-clicking.room-tile-available {
        box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.85), 0 0 26px rgba(0, 212, 255, 0.42) !important;
      }
      .room-tile-clicking.room-tile-occupied {
        box-shadow: 0 0 0 2px rgba(244, 63, 94, 0.85), 0 0 26px rgba(244, 63, 94, 0.35) !important;
      }
      .room-click-ripple {
        position: absolute;
        width: 96px;
        height: 96px;
        border-radius: 9999px;
        pointer-events: none;
        background: radial-gradient(circle, rgba(34, 211, 238, 0.65) 0%, rgba(255, 255, 255, 0.25) 55%, transparent 72%);
        animation: roomClickRippleWave 380ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }

      /* =====================================================================
         DARK MODE (MIDNIGHT NAVY + ELECTRIC NEON CYAN)
         ===================================================================== */
      html.theme-dark {
        color-scheme: dark;
      }
      html.theme-dark body.staygrid-page-bg {
        background:
          radial-gradient(circle at 12% 0%, rgba(0, 216, 255, 0.14), transparent 36%),
          radial-gradient(circle at 88% 12%, rgba(14, 165, 233, 0.12), transparent 38%),
          #030D20 !important;
        color: #E2E8F0 !important;
      }
      html.theme-dark body.staygrid-page-bg::before,
      html.theme-dark body.staygrid-page-bg::after {
        display: none !important;
        background-image: none !important;
      }
      html.theme-dark .neon-header {
        background: linear-gradient(90deg, #020A19 0%, #051634 50%, #020C1F 100%);
        border-bottom-color: rgba(34, 211, 238, 0.42);
        box-shadow: 0 1px 0 rgba(0, 216, 255, 0.35), 0 12px 34px rgba(0, 0, 0, 0.55);
      }

      /* Primary & Secondary Surfaces */
      html.theme-dark .bg-white,
      html.theme-dark .bg-white\/90,
      html.theme-dark .bg-white\/95 {
        background-color: #071834 !important;
      }
      html.theme-dark .bg-slate-50,
      html.theme-dark .bg-slate-50\/75,
      html.theme-dark .bg-slate-50\/70,
      html.theme-dark .bg-slate-50\/60 {
        background-color: #0A2042 !important;
      }
      html.theme-dark .bg-slate-100,
      html.theme-dark .bg-slate-100\/80 {
        background-color: #0E2952 !important;
      }
      html.theme-dark .hover\:bg-slate-50:hover,
      html.theme-dark .hover\:bg-slate-100:hover,
      html.theme-dark .hover\:bg-white:hover,
      html.theme-dark .hover\:bg-white\/90:hover {
        background-color: #103160 !important;
      }

      /* Amenities & Light Gradient Strips */
      html.theme-dark .from-\[\#EEF9FF\] {
        --tw-gradient-from: #071B3B var(--tw-gradient-from-position) !important;
        --tw-gradient-to: rgba(7, 27, 59, 0) var(--tw-gradient-to-position) !important;
        --tw-gradient-stops: var(--tw-gradient-from), #0B254E, #071B3B !important;
      }
      html.theme-dark .from-slate-100 {
        --tw-gradient-from: #071834 var(--tw-gradient-from-position) !important;
        --tw-gradient-stops: var(--tw-gradient-from), #0A2145, #0E2B57 !important;
      }

      /* Semantic Tinted Surfaces */
      html.theme-dark .bg-emerald-50,
      html.theme-dark .bg-emerald-50\/75,
      html.theme-dark .bg-emerald-50\/55,
      html.theme-dark .bg-emerald-50\/50 {
        background-color: rgba(16, 185, 129, 0.14) !important;
      }
      html.theme-dark .bg-rose-50,
      html.theme-dark .bg-rose-50\/75,
      html.theme-dark .bg-rose-50\/55,
      html.theme-dark .hover\:bg-rose-50:hover,
      html.theme-dark .hover\:bg-rose-100:hover {
        background-color: rgba(244, 63, 94, 0.15) !important;
      }
      html.theme-dark .bg-amber-50,
      html.theme-dark .bg-amber-50\/70,
      html.theme-dark .bg-amber-50\/65 {
        background-color: rgba(245, 158, 11, 0.14) !important;
      }
      html.theme-dark .bg-cyan-50,
      html.theme-dark .bg-cyan-50\/80,
      html.theme-dark .bg-cyan-50\/60,
      html.theme-dark .bg-cyan-50\/45,
      html.theme-dark .bg-cyan-50\/40,
      html.theme-dark .bg-cyan-50\/35,
      html.theme-dark .bg-indigo-50,
      html.theme-dark .bg-indigo-50\/70,
      html.theme-dark .bg-indigo-50\/50,
      html.theme-dark .hover\:bg-cyan-50:hover,
      html.theme-dark .hover\:bg-cyan-100:hover,
      html.theme-dark .hover\:bg-indigo-50:hover,
      html.theme-dark .hover\:bg-indigo-100:hover {
        background-color: rgba(34, 211, 238, 0.13) !important;
      }

      /* Borders & Dividers */
      html.theme-dark .border-slate-100,
      html.theme-dark .border-slate-200,
      html.theme-dark .border-slate-200\/80,
      html.theme-dark .border-slate-200\/70,
      html.theme-dark .border-slate-300 {
        border-color: rgba(56, 189, 248, 0.2) !important;
      }
      html.theme-dark .border-emerald-200,
      html.theme-dark .border-emerald-300 {
        border-color: rgba(52, 211, 153, 0.4) !important;
      }
      html.theme-dark .border-rose-200,
      html.theme-dark .border-rose-300 {
        border-color: rgba(251, 113, 133, 0.42) !important;
      }
      html.theme-dark .border-amber-200,
      html.theme-dark .border-amber-300 {
        border-color: rgba(251, 191, 36, 0.38) !important;
      }
      html.theme-dark .border-cyan-200,
      html.theme-dark .border-cyan-200\/80,
      html.theme-dark .border-cyan-300,
      html.theme-dark .border-indigo-200 {
        border-color: rgba(34, 211, 238, 0.36) !important;
      }

      /* High-Contrast Typography */
      html.theme-dark .text-slate-900,
      html.theme-dark .text-slate-800,
      html.theme-dark .text-navy-900,
      html.theme-dark .text-navy-950,
      html.theme-dark .text-navy-800,
      html.theme-dark .text-indigo-950 {
        color: #F1F5F9 !important;
      }
      html.theme-dark .text-slate-700,
      html.theme-dark .text-slate-600 {
        color: #CBD5E1 !important;
      }
      html.theme-dark .text-slate-500,
      html.theme-dark .text-slate-400 {
        color: #94A3B8 !important;
      }
      html.theme-dark .text-indigo-600,
      html.theme-dark .text-indigo-700,
      html.theme-dark .text-indigo-800 {
        color: #38BDF8 !important;
      }
      html.theme-dark .text-emerald-700,
      html.theme-dark .text-emerald-800 {
        color: #34D399 !important;
      }
      html.theme-dark .text-rose-600,
      html.theme-dark .text-rose-700,
      html.theme-dark .text-rose-800,
      html.theme-dark .text-rose-900 {
        color: #FDA4AF !important;
      }
      html.theme-dark .text-amber-700,
      html.theme-dark .text-amber-800,
      html.theme-dark .text-amber-900,
      html.theme-dark .text-amber-950 {
        color: #FCD34D !important;
      }

      /* Preserve dark ink on bright electric-cyan buttons & badges */
      html.theme-dark .neon-cyan-btn,
      html.theme-dark .neon-cyan-btn *,
      html.theme-dark .bg-cyan-400,
      html.theme-dark .bg-cyan-400 * {
        color: #04142E !important;
      }
      html.theme-dark #gmp-quota-banner {
        background-color: #3B2806 !important;
        border-color: rgba(251, 191, 36, 0.45) !important;
        color: #FDE68A !important;
      }
      html.theme-dark #gmp-quota-banner a {
        color: #FEF3C7 !important;
      }

      /* Inputs, Selects, Textareas */
      html.theme-dark input:not([type="checkbox"]):not([type="radio"]),
      html.theme-dark select,
      html.theme-dark textarea {
        background-color: #041126 !important;
        color: #F1F5F9 !important;
        border-color: rgba(56, 189, 248, 0.3) !important;
      }
      html.theme-dark input::placeholder,
      html.theme-dark textarea::placeholder {
        color: #64748B !important;
      }
      html.theme-dark input:focus,
      html.theme-dark select:focus,
      html.theme-dark textarea:focus {
        border-color: #22D3EE !important;
        box-shadow: 0 0 0 2px rgba(34, 211, 238, 0.22) !important;
      }

      /* Neon Cards & Search Dock Elevation in Dark Mode */
      html.theme-dark .neon-card {
        border-color: rgba(34, 211, 238, 0.24) !important;
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.42);
      }
      html.theme-dark .neon-card:hover {
        border-color: rgba(34, 211, 238, 0.65) !important;
        box-shadow: 0 0 0 1px rgba(34, 211, 238, 0.3), 0 14px 34px rgba(0, 194, 243, 0.22);
      }
      html.theme-dark .neon-search-dock {
        background-color: #061630 !important;
        border-color: rgba(34, 211, 238, 0.42) !important;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), 0 0 24px rgba(0, 212, 255, 0.16);
      }
      html.theme-dark .bg-slate-900 {
        background-color: #0B254F !important;
      }

      /* Theme Toggle Switch Active State */
      .theme-mode-pill {
        background: rgba(3, 16, 38, 0.72);
        border: 1px solid rgba(34, 211, 238, 0.34);
      }
      .theme-mode-btn {
        color: #94A3B8;
        transition: background-color 150ms ease, color 150ms ease, box-shadow 150ms ease;
      }
      .theme-mode-btn:hover {
        color: #E2E8F0;
      }
      .theme-mode-btn[aria-pressed="true"] {
        background: linear-gradient(135deg, #22D3EE 0%, #00B8EE 100%);
        color: #04142E !important;
        box-shadow: 0 0 12px rgba(34, 211, 238, 0.45);
      }

      /* One-Tap Toggle Pill Chips (Light + Dark Mode) */
      .filter-pill-chip {
        display: inline-flex;
        align-items: center;
        gap: 0.4rem;
        min-height: 36px;
        padding: 0.375rem 0.9rem;
        border-radius: 9999px;
        border: 1px solid #CBD5E1;
        background-color: #FFFFFF;
        color: #334155;
        font-size: 0.75rem;
        font-weight: 600;
        line-height: 1;
        white-space: nowrap;
        cursor: pointer;
        user-select: none;
        transition: transform 120ms ease, background-color 150ms ease, border-color 150ms ease, color 150ms ease, box-shadow 150ms ease;
      }
      .filter-pill-chip:hover {
        border-color: #06B6D4;
        background-color: #F0FDFA;

        function inferRoomSharing(rm, rIdx) {
          if (SHARING_OPTIONS.includes(rm.sharing)) return rm.sharing;
          const txt = `${rm.label || ''} ${rm.maintenanceNotes || ''}`.toLowerCase();
          if (/triple|3[\s-]?shar|2bhk/.test(txt)) return 'Triple';
          if (/twin|double|2[\s-]?shar/.test(txt)) return 'Double';
          if (/single|studio|1rk|1bhk/.test(txt) && rIdx % 3 !== 2) return 'Single';
          return SHARING_OPTIONS[rIdx % 3];
        }

        function inferRoomType(rm, rIdx) {
          if (ROOM_TYPE_OPTIONS.includes(rm.roomType)) return rm.roomType;
          const txt = `${rm.label || ''} ${rm.maintenanceNotes || ''}`.toLowerCase();
          if (/non[\s-]?ac/.test(txt)) return 'Non-AC';
          if (/\bsplit ac\b|\bac\b/.test(txt)) return 'AC';
          const rent = Number(rm.rent) || 0;
          if (rent >= 11500) return 'AC';
          return rIdx % 2 === 0 ? 'AC' : 'Non-AC';
        }

        function normalizePropertyRooms(prop) {
          const seedMeta = SEED_PROPERTY_META[prop.id] || null;
          const pType = prop.propertyType === 'flat' ? 'flat' : 'hostel';
          const gender = GENDER_OPTIONS.includes(prop.gender)
            ? prop.gender
            : seedMeta?.gender || 'Co-living';
          const defaultAmenities = seedMeta?.amenities || {
            food: pType !== 'flat',
            wifi: true,
            laundry: false,
            parking: true,
            powerBackup: true,
          };
          const rawAm = prop.amenities && typeof prop.amenities === 'object' ? prop.amenities : {};
          const amenities = {
            food: typeof rawAm.food === 'boolean' ? rawAm.food : defaultAmenities.food,
            wifi: typeof rawAm.wifi === 'boolean' ? rawAm.wifi : defaultAmenities.wifi,
            laundry: typeof rawAm.laundry === 'boolean' ? rawAm.laundry : defaultAmenities.laundry,
            parking: typeof rawAm.parking === 'boolean' ? rawAm.parking : defaultAmenities.parking,
            powerBackup: typeof rawAm.powerBackup === 'boolean' ? rawAm.powerBackup : defaultAmenities.powerBackup,
          };

          return {
            ...prop,
            propertyType: pType,
            gender,
            amenities,
            floors: (prop.floors || []).map((fl) => ({
              ...fl,
              rooms: (fl.rooms || []).map((rm, rIdx) => ({
                ...rm,
                sharing: inferRoomSharing(rm, rIdx),
                roomType: inferRoomType(rm, rIdx),
                tenants: Array.isArray(rm.tenants)
                  ? rm.tenants
                  : SEED_ROOM_TENANTS[rm.id]
                  ? deepClone(SEED_ROOM_TENANTS[rm.id])
                  : [],
              })),
            })),
          };
        }

        function triggerRoomClickAnimation(tileEl, evt, callback) {
          const prefersReduced =
            typeof window !== 'undefined' &&
            window.matchMedia &&
            window.matchMedia('(prefers-reduced-motion: reduce)').matches;

          if (!tileEl || prefersReduced) {
            callback();
            return;
          }
          if (tileEl.dataset.clickAnimating === '1') return;
          tileEl.dataset.clickAnimating = '1';

          const rect = tileEl.getBoundingClientRect();
          const hasPointerCoords =
            evt && typeof evt.clientX === 'number' && typeof evt.clientY === 'number' && (evt.clientX !== 0 || evt.clientY !== 0);
          const rx = hasPointerCoords ? evt.clientX - rect.left : rect.width / 2;
          const ry = hasPointerCoords ? evt.clientY - rect.top : rect.height / 2;

          const ripple = document.createElement('span');
          ripple.className = 'room-click-ripple';
          ripple.style.left = `${rx}px`;
          ripple.style.top = `${ry}px`;
          tileEl.appendChild(ripple);

          tileEl.classList.remove('room-tile-clicking');
          void tileEl.offsetWidth;
          tileEl.classList.add('room-tile-clicking');

          window.setTimeout(() => {
            callback();
          }, 190);

          window.setTimeout(() => {
            ripple.remove();
            tileEl.classList.remove('room-tile-clicking');
            delete tileEl.dataset.clickAnimating;
          }, 420);
        }

        function loadProperties() {

              localStorage.setItem(STORAGE_KEYS.PROPERTIES, JSON.stringify(seeded));
              return deepClone(seeded);
            }
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed) && parsed.length > 0) {

        function getPortfolioDuesSummary() {
          let totalMonthlyRent = 0;
          let collectedRent = 0;
          let pendingRent = 0;
          let totalTenants = 0;
          let occupiedRooms = 0;
          let availableRooms = 0;
          const pendingTenants = [];
          const paidTenants = [];

          for (const prop of state.properties || []) {
            for (const floor of prop.floors || []) {
              for (const room of floor.rooms || []) {
                const rent = Number(room.rent) || 0;
                if (room.status === 'available') {
                  availableRooms += 1;
                } else {
                  occupiedRooms += 1;
                  totalMonthlyRent += rent;
                }
                const tenants = Array.isArray(room.tenants) ? room.tenants : [];
                if (tenants.length > 0) {
                  const perTenantShare = Math.round(rent / tenants.length);
                  for (const t of tenants) {
                    totalTenants += 1;
                    const entry = {
                      tenantName: t.name,
                      phone: t.phone || '',
                      email: t.email || '',
                      moveInDate: t.moveInDate || '',
                      propertyId: prop.id,
                      propertyName: prop.name,
                      location: prop.location,
                      floorName: floor.name,
                      roomLabel: room.label,
                      roomRent: rent,
                      estimatedShare: perTenantShare,
                      rentStatus: t.rentStatus === 'pending' ? 'pending' : 'paid',
                    };
                    if (entry.rentStatus === 'pending') {
                      pendingRent += perTenantShare;
                      pendingTenants.push(entry);
                    } else {
                      collectedRent += perTenantShare;
                      paidTenants.push(entry);
                    }
                  }
                } else if (room.status !== 'available') {
                  pendingRent += rent;
                }
              }
            }

          const openComplaints = (state.complaints || []).filter((c) => c.status !== 'Resolved');
          const unreadNotifications = (state.notifications || []).filter((n) => !n.read);

          return {
            propertyCount: (state.properties || []).length,
            occupiedRooms,
            availableRooms,
            totalTenants,
            totalMonthlyRent,
            collectedRent,
            pendingRent,
            pendingTenants,
            paidTenants,
            openComplaintsCount: openComplaints.length,
            unreadNotificationsCount: unreadNotifications.length,
          };
        }

        function renderSafeMarkdown(text) {
          const escaped = escapeHtml(String(text || ''));
          const lines = escaped.split(/\r?\n/);
          let html = '';
          let inList = false;

          for (const rawLine of lines) {
            const line = rawLine
              .replace(/\*\*(.+?)\*\*/g, '<strong class="font-semibold text-slate-900">$1</strong>')
              .replace(/`([^`]+)`/g, '<code class="rounded bg-slate-200/70 px-1 py-0.5 font-mono text-[11px]">$1</code>');
            const bulletMatch = line.match(/^\s*[-*•]\s+(.*)$/);
            const numMatch = line.match(/^\s*\d+\.\s+(.*)$/);

            if (bulletMatch || numMatch) {
              if (!inList) {
                html += '<ul class="my-1.5 list-disc space-y-1 pl-5">';
                inList = true;
              }
              html += `<li>${bulletMatch ? bulletMatch[1] : numMatch[1]}</li>`;
            } else {
              if (inList) {
                html += '</ul>';
                inList = false;
              }
              if (line.trim() === '') {
                html += '<div class="h-1.5"></div>';
              } else {
                html += `<p class="leading-relaxed">${line}</p>`;
              }
            }
          }
          if (inList) html += '</ul>';
          return html;
        }

        function isValidCoords(c) {
          return (
            c &&
            typeof c === 'object' &&
            Number.isFinite(Number(c.lat)) &&
            Number.isFinite(Number(c.lng)) &&
            Math.abs(Number(c.lat)) <= 90 &&
            Math.abs(Number(c.lng)) <= 180
          );
        }

        function getPropertyCoords(property) {
          if (isValidCoords(property?.coords)) {
            return { lat: Number(property.coords.lat), lng: Number(property.coords.lng) };
          }
          return getCoordsForLocation(property?.location || '');
        }

        function haversineDistanceKm(a, b) {
          if (!isValidCoords(a) || !isValidCoords(b)) return Infinity;
          const R = 6371;
          const toRad = (deg) => (deg * Math.PI) / 180;
          const dLat = toRad(Number(b.lat) - Number(a.lat));
          const dLng = toRad(Number(b.lng) - Number(a.lng));
          const lat1 = toRad(Number(a.lat));
          const lat2 = toRad(Number(b.lat));
          const h =
            Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
          return 2 * R * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
        }

        function formatCoordsShort(coords) {
          if (!isValidCoords(coords)) return '';
          return `${Number(coords.lat).toFixed(4)}, ${Number(coords.lng).toFixed(4)}`;

          async searchNearbyPlaces(containerId, queryText, locationName, center) {
            let inst = this.instances[containerId];
            if (!inst) {
              inst = await this.mountMap(containerId, center, []);
            }
            if (!inst) {
              return { places: [], error: 'Google Maps is unavailable in offline mode.' };
            }

            try {
              const [{ Place }, { AdvancedMarkerElement }, { LatLngBounds }] = await Promise.all([
                window.google.maps.importLibrary('places'),
                window.google.maps.importLibrary('marker'),
                window.google.maps.importLibrary('core'),
              ]);

              // Clear previous search place markers
              for (const m of inst.placeMarkers) {
                m.map = null;
              }
              inst.placeMarkers = [];

              const { places } = await Place.searchByText({
                textQuery: `${queryText} near ${locationName}`,
                fields: ['displayName', 'location', 'formattedAddress', 'rating', 'googleMapsURI'],
                locationBias: { center, radius: 5000 },
                maxResultCount: 6,
                language: 'en',
                region: 'IN',
              });

              const list = Array.isArray(places) ? places : [];
              const bounds = new LatLngBounds();
              bounds.extend(center);

              const normalized = [];
              for (const place of list) {
                if (!place.location) continue;
                bounds.extend(place.location);
                const name = place.displayName || 'Nearby Place';
                const marker = new AdvancedMarkerElement({
                  map: inst.map,
                  position: place.location,
                  title: name,
                });
                marker.append(this.createPinNode(name.slice(0, 22), '#0369A1', '#67E8F9'));
                marker.addEventListener('click', () => {
                  const box = document.createElement('div');
                  box.style.cssText = 'font-family:"DM Sans",sans-serif;max-width:230px;padding:2px;';
                  const t = document.createElement('div');
                  t.style.cssText = 'font-weight:700;color:#061A3A;font-size:13px;';
                  t.textContent = name;
                  const a = document.createElement('div');
                  a.style.cssText = 'color:#475569;font-size:11px;margin-top:3px;';
                  a.textContent = place.formattedAddress || '';
                  box.appendChild(t);
                  box.appendChild(a);
                  if (place.rating) {
                    const r = document.createElement('div');
                    r.style.cssText = 'color:#B45309;font-size:11px;font-weight:600;margin-top:4px;';
                    r.textContent = `★ ${place.rating} on Google Maps`;
                    box.appendChild(r);
                  }
                  if (place.googleMapsURI) {
                    const link = document.createElement('a');
                    link.href = place.googleMapsURI;
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                    link.style.cssText = 'display:inline-block;margin-top:6px;color:#0284C7;font-size:11px;font-weight:600;text-decoration:underline;';
                    link.textContent = 'Open in Google Maps →';
                    box.appendChild(link);
                  }
                  inst.infoWindow.setContent(box);
                  inst.infoWindow.open({ map: inst.map, anchor: marker });
                });
                inst.placeMarkers.push(marker);

                normalized.push({
                  name,
                  address: place.formattedAddress || '',
                  rating: place.rating || null,
                  uri: place.googleMapsURI || '',
                });
              }

              if (normalized.length > 0) {
                inst.map.fitBounds(bounds);
              }
              return { places: normalized, error: '' };
            } catch (err) {
              const msg = String(err?.message || err);
              if (
                msg.includes('429') ||
                msg.includes('RESOURCE_EXHAUSTED') ||
                msg.includes('OVER_QUERY_LIMIT') ||
                msg.includes('QuotaExceeded')
              ) {
                window.dispatchEvent(new CustomEvent('gmp-quota-exceeded'));
              }
              return { places: [], error: 'Unable to fetch nearby places right now. Please try again.' };
            }
          },

          pickerInstances: {},

          async reverseGeocode(lat, lng) {
            try {
              const res = await fetch(
                `/api/maps/reverse-geocode?lat=${encodeURIComponent(lat)}&lng=${encodeURIComponent(lng)}`,
                { credentials: 'include' }
              );
              if (res.status === 429) {
                window.dispatchEvent(new CustomEvent('gmp-quota-exceeded'));
                return { locationLabel: '', formattedAddress: '', placeId: '' };
              }
              if (!res.ok) return { locationLabel: '', formattedAddress: '', placeId: '' };
              const data = await res.json();
              if (data?.quotaExceeded) {
                window.dispatchEvent(new CustomEvent('gmp-quota-exceeded'));
              }
              return {
                locationLabel: String(data?.locationLabel || '').trim(),
                formattedAddress: String(data?.formattedAddress || '').trim(),
                placeId: String(data?.placeId || '').trim(),
              };
            } catch {
              return { locationLabel: '', formattedAddress: '', placeId: '' };
            }
          },

          updatePickerPosition(containerId, coords, formattedAddress = '') {
            const inst = this.pickerInstances[containerId];
            if (!inst || !isValidCoords(coords)) return;
            try {
              inst.map.panTo(coords);
              inst.map.setZoom(16);
              inst.marker.position = coords;
              if (inst.searchInputId && formattedAddress) {
                const inp = document.getElementById(inst.searchInputId);
                if (inp) inp.value = formattedAddress;
              }
            } catch {}
          },

          detectAutoLocation() {
            return new Promise((resolve, reject) => {
              if (!('geolocation' in navigator)) {
                reject(new Error('Auto Location is not supported in this browser.'));
                return;
              }
              navigator.geolocation.getCurrentPosition(
                async (pos) => {
                  const coords = {
                    lat: Number(pos.coords.latitude.toFixed(6)),
                    lng: Number(pos.coords.longitude.toFixed(6)),
                  };
                  const geo = await StayGridMaps.reverseGeocode(coords.lat, coords.lng);
                  const fallbackLabel = `${coords.lat.toFixed(4)}, ${coords.lng.toFixed(4)}`;
                  resolve({
                    coords,
                    locationLabel: geo.locationLabel || fallbackLabel,
                    formattedAddress: geo.formattedAddress || geo.locationLabel || fallbackLabel,
                    placeId: geo.placeId || '',
                  });
                },
                (err) => {
                  const msg =
                    err?.code === 1
                      ? 'Location access was denied. Please allow location permission in your browser.'
                      : err?.code === 3
                      ? 'Auto Location timed out. Please try again or pick your area manually.'
                      : 'Unable to detect your current location right now.';
                  reject(new Error(msg));
                },
                { enableHighAccuracy: true, timeout: 12000, maximumAge: 60000 }
              );
            });
          },

          async mountLocationPicker(opts) {
            const {
              containerId,
              searchInputId,
              suggestionsId,
              gpsBtnId,
              statusElId,
              initialCenter,
              pinLabel = 'Selected Location',
              onLocationPicked,
            } = opts;

            const container = document.getElementById(containerId);
            if (!container) return null;

            const ok = await this.ensureBootstrap();
            if (!ok) {
              container.innerHTML = `
                <div class="flex h-full w-full flex-col items-center justify-center bg-slate-900/95 px-6 text-center text-slate-200">
                  <p class="font-display text-sm font-bold text-cyan-300">Google Maps Location Picker</p>
                  <p class="mt-1.5 max-w-md text-xs leading-relaxed text-slate-300">

                  </p>
                </div>
              `;
              return null;
            }

            try {
              const [{ Map }, { AdvancedMarkerElement }, placesLib] = await Promise.all([
                window.google.maps.importLibrary('maps'),
                window.google.maps.importLibrary('marker'),
                window.google.maps.importLibrary('places'),
              ]);

              const { AutocompleteSuggestion, AutocompleteSessionToken } = placesLib || {};
              const startCenter = isValidCoords(initialCenter)
                ? { lat: Number(initialCenter.lat), lng: Number(initialCenter.lng) }
                : { lat: 12.9352, lng: 77.6245 };

              container.innerHTML = '';
              const map = new Map(container, {
                center: startCenter,
                zoom: 15,
                mapId: 'DEMO_MAP_ID',
                renderingType: 'VECTOR',
                gestureHandling: 'greedy',
                mapTypeControl: false,
                streetViewControl: false,
                internalUsageAttributionIds: ['gmp_mcp_codeassist_v1_aistudio'],
              });

              const marker = new AdvancedMarkerElement({
                map,
                position: startCenter,
                title: pinLabel,
                gmpDraggable: true,
              });
              const pinNode = this.createPinNode(pinLabel.slice(0, 22), '#061A3A', '#22D3EE');
              marker.append(pinNode);

              const setStatus = (text) => {
                const el = statusElId ? document.getElementById(statusElId) : null;
                if (el) el.textContent = text;
              };

              const handlePinMove = async (lat, lng, sourceLabel) => {
                const pos = { lat: Number(lat), lng: Number(lng) };
                marker.position = pos;
                map.panTo(pos);
                setStatus(`Resolving address for ${formatCoordsShort(pos)}...`);
                const geo = await this.reverseGeocode(pos.lat, pos.lng);
                const fallbackLabel = `Pinned Location (${formatCoordsShort(pos)})`;
                const finalLabel = geo.locationLabel || fallbackLabel;
                const finalAddr = geo.formattedAddress || finalLabel;
                setStatus(`Pinned: ${finalLabel} (${formatCoordsShort(pos)})`);
                if (typeof onLocationPicked === 'function') {
                  onLocationPicked({
                    locationLabel: finalLabel,
                    formattedAddress: finalAddr,
                    coords: pos,
                    placeId: geo.placeId || '',
                    source: sourceLabel,
                  });
                }
              };

              map.addListener('click', (evt) => {
                if (!evt?.latLng) return;
                void handlePinMove(evt.latLng.lat(), evt.latLng.lng(), 'map_click');
              });

              marker.addListener('dragend', () => {
                const pos = marker.position;
                if (!pos) return;
                const lat = typeof pos.lat === 'function' ? pos.lat() : Number(pos.lat);
                const lng = typeof pos.lng === 'function' ? pos.lng() : Number(pos.lng);
                if (Number.isFinite(lat) && Number.isFinite(lng)) {
                  void handlePinMove(lat, lng, 'pin_drag');
                }
              });

              // Places API (New) AutocompleteSuggestion with AutocompleteSessionToken
              const searchInput = searchInputId ? document.getElementById(searchInputId) : null;
              const suggestionsEl = suggestionsId ? document.getElementById(suggestionsId) : null;
              let sessionToken = AutocompleteSessionToken ? new AutocompleteSessionToken() : null;
              let debounceTimer = null;
              let newestReqId = 0;

              const hideSuggestions = () => {
                if (suggestionsEl) {
                  suggestionsEl.classList.add('hidden');
                  suggestionsEl.innerHTML = '';
                }
              };

              if (searchInput && suggestionsEl && AutocompleteSuggestion) {
                searchInput.addEventListener('input', () => {
                  const q = searchInput.value.trim();
                  if (debounceTimer) window.clearTimeout(debounceTimer);
                  if (q.length < 2) {
                    hideSuggestions();
                    return;
                  }
                  debounceTimer = window.setTimeout(async () => {
                    const reqId = ++newestReqId;
                    try {
                      const req = {
                        input: q,
                        language: 'en',
                        region: 'IN',
                      };
                      if (sessionToken) req.sessionToken = sessionToken;
                      const res = await AutocompleteSuggestion.fetchAutocompleteSuggestions(req);
                      if (reqId !== newestReqId) return;
                      const suggestions = Array.isArray(res?.suggestions) ? res.suggestions : [];
                      suggestionsEl.innerHTML = '';
                      if (suggestions.length === 0) {
                        hideSuggestions();
                        return;
                      }
                      for (const s of suggestions.slice(0, 5)) {
                        const pred = s.placePrediction;
                        if (!pred) continue;
                        const li = document.createElement('li');
                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.className =
                          'flex w-full items-start gap-2.5 px-3.5 py-2.5 text-left text-xs text-slate-800 transition-colors hover:bg-cyan-50';
                        const mainText = pred.mainText?.text || pred.text?.toString() || '';
                        const secText = pred.secondaryText?.text || '';
                        btn.innerHTML = `
                          <svg class="mt-0.5 h-3.5 w-3.5 shrink-0 text-cyan-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>
                          <span class="min-w-0 flex-1">
                            <span class="block truncate font-semibold text-slate-900">${escapeHtml(mainText)}</span>
                            ${secText ? `<span class="block truncate text-[11px] text-slate-500">${escapeHtml(secText)}</span>` : ''}
                          </span>
                        `;
                        btn.addEventListener('click', async () => {
                          hideSuggestions();
                          setStatus('Fetching Google Maps place details...');
                          try {
                            const place = pred.toPlace();
                            await place.fetchFields({
                              fields: ['displayName', 'formattedAddress', 'location', 'id'],
                            });
                            if (AutocompleteSessionToken) {
                              sessionToken = new AutocompleteSessionToken();
                            }
                            const loc = place.location;
                            const lat = loc ? (typeof loc.lat === 'function' ? loc.lat() : Number(loc.lat)) : null;
                            const lng = loc ? (typeof loc.lng === 'function' ? loc.lng() : Number(loc.lng)) : null;
                            const display = place.displayName || mainText;
                            const addr = place.formattedAddress || (secText ? `${mainText}, ${secText}` : mainText);
                            const conciseLabel = secText
                              ? `${mainText}, ${secText.split(',')[0].trim()}`
                              : display;

                            searchInput.value = addr;
                            if (Number.isFinite(lat) && Number.isFinite(lng)) {
                              const pos = { lat, lng };
                              marker.position = pos;
                              map.setCenter(pos);
                              map.setZoom(16);
                              setStatus(`Pinned: ${conciseLabel} (${formatCoordsShort(pos)})`);
                              if (typeof onLocationPicked === 'function') {
                                onLocationPicked({
                                  locationLabel: conciseLabel,
                                  formattedAddress: addr,
                                  coords: pos,
                                  placeId: place.id || '',
                                  source: 'places_autocomplete',
                                });
                              }
                            }
                          } catch (err) {
                            const msg = String(err?.message || err);
                            if (
                              msg.includes('429') ||
                              msg.includes('RESOURCE_EXHAUSTED') ||
                              msg.includes('OVER_QUERY_LIMIT')
                            ) {
                              window.dispatchEvent(new CustomEvent('gmp-quota-exceeded'));
                            }
                            setStatus('Could not fetch place details. Click on the map to drop a pin.');
                          }
                        });
                        li.appendChild(btn);
                        suggestionsEl.appendChild(li);
                      }
                      suggestionsEl.classList.remove('hidden');
                    } catch (err) {
                      const msg = String(err?.message || err);
                      if (
                        msg.includes('429') ||
                        msg.includes('RESOURCE_EXHAUSTED') ||
                        msg.includes('OVER_QUERY_LIMIT')
                      ) {
                        window.dispatchEvent(new CustomEvent('gmp-quota-exceeded'));
                      }
                      hideSuggestions();
                    }
                  }, 250);
                });

                searchInput.addEventListener('blur', () => {
                  window.setTimeout(hideSuggestions, 180);
                });
              }

              // GPS Locate Button (with explicit user tap consent)
              const gpsBtn = gpsBtnId ? document.getElementById(gpsBtnId) : null;
              if (gpsBtn) {
                gpsBtn.addEventListener('click', () => {
                  if (!navigator.geolocation) {
                    showToast('GPS not available', 'Your browser does not support Geolocation. Search or tap on the map instead.', 'error');
                    return;
                  }
                  setStatus('Locating your current GPS position...');
                  navigator.geolocation.getCurrentPosition(
                    (pos) => {
                      const lat = pos.coords.latitude;
                      const lng = pos.coords.longitude;
                      map.setZoom(16);
                      void handlePinMove(lat, lng, 'gps');
                    },
                    () => {
                      setStatus('Location permission denied — search or tap directly on the map.');
                      showToast('Location access blocked', 'Allow location permission or tap anywhere on the Google Map to drop your pin.', 'info');
                    },
                    { enableHighAccuracy: true, timeout: 10000 }
                  );
                });
              }

              const pickerObj = {
                map,
                marker,
                panTo(coords, label) {
                  if (!isValidCoords(coords)) return;
                  const pos = { lat: Number(coords.lat), lng: Number(coords.lng) };
                  marker.position = pos;
                  map.setCenter(pos);
                  map.setZoom(15);
                  if (label) setStatus(`Pinned: ${label} (${formatCoordsShort(pos)})`);
                },
              };
              this.pickerInstances[containerId] = pickerObj;
              return pickerObj;
            } catch (err) {
              const msg = String(err?.message || err);
              if (msg.includes('OVER_QUERY_LIMIT') || msg.includes('RESOURCE_EXHAUSTED') || msg.includes('429')) {
                window.dispatchEvent(new CustomEvent('gmp-quota-exceeded'));
              }
              container.innerHTML = `
                <div class="flex h-full w-full flex-col items-center justify-center bg-slate-900 px-6 text-center text-slate-200">
                  <p class="text-sm font-semibold text-amber-300">Unable to load interactive Google Map picker.</p>
                  <p class="mt-1 text-xs text-slate-400">You can still type your location directly in the field above.</p>
                </div>
              `;
              return null;
            }
          },
        };

        function getPropertyStats(property) {
          let totalRooms = 0;
          let availableRooms = 0;
          let occupiedRooms = 0;
          let minRent = Infinity;

          for (const floor of property.floors || []) {
            for (const room of floor.rooms || []) {
              totalRooms += 1;
              if (room.status === 'available') availableRooms += 1;
              else occupiedRooms += 1;
              if (room.rent > 0 && room.rent < minRent) minRent = room.rent;
            }
          }
          return {
            totalFloors: (property.floors || []).length,
            totalRooms,
            availableRooms,
            occupiedRooms,
            minRent: minRent === Infinity ? 0 : minRent,
            occupancyRate: totalRooms > 0 ? Math.round((occupiedRooms / totalRooms) * 100) : 0,
          };
        }

        function getPropertyCoverImage(property) {
          for (const floor of property.floors || []) {
            for (const room of floor.rooms || []) {
              if (room.images && room.images.length > 0) {
                return normalizeImageSrc(room.images[0]);
              }

          return '';

          return new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onerror = () => reject(new Error('Failed to read image'));
            reader.onload = () => {
              const dataUrl = reader.result;
              const img = new Image();
              img.onload = () => {
                const MAX_DIM = 960;
                let { width, height } = img;
                if (width <= MAX_DIM && height <= MAX_DIM && dataUrl.length < 280000) {
                  resolve(dataUrl);
                  return;
                }
                const scale = Math.min(MAX_DIM / width, MAX_DIM / height, 1);
                width = Math.round(width * scale);
                height = Math.round(height * scale);
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                if (!ctx) {
                  resolve(dataUrl);
                  return;
                }
                ctx.drawImage(img, 0, 0, width, height);
                resolve(canvas.toDataURL('image/jpeg', 0.78));
              };
              img.onerror = () => resolve(dataUrl);
              img.src = dataUrl;
            };
            reader.readAsDataURL(file);
          });
        }

        async function apiRequestJson(url, options = {}, maxRetries = 2) {
          const reqOpts = {
            credentials: 'include',
            ...options,
            headers: {
              Accept: 'application/json',
              ...(options.headers || {}),
            },
          };

          let lastErr = null;
          for (let attempt = 0; attempt <= maxRetries; attempt++) {
            try {
              const res = await fetch(url, reqOpts);
              const rawText = await res.text();
              let data = null;
              if (rawText) {
                try {
                  data = JSON.parse(rawText);
                } catch {
                  data = null;
                }
              }

              // Retry transient gateway/restart statuses (502/503/504)
              if ((res.status === 502 || res.status === 503 || res.status === 504) && attempt < maxRetries) {
                await new Promise((r) => setTimeout(r, 500 * (attempt + 1)));
                continue;
              }

              if (!data && !res.ok) {
                return {
                  ok: false,
                  status: res.status,
                  data: null,
                  error:
                    res.status === 502 || res.status === 503 || res.status === 504
                      ? 'StayGrid server is starting up. Please try again in a moment.'
                      : `Server returned status ${res.status}. Please refresh and try again.`,
                };
              }

              if (!data && res.ok) {
                return {
                  ok: false,
                  status: res.status,
                  data: null,
                  error: 'Unexpected response from StayGrid server. Please refresh the page and try again.',
                };
              }

              return {
                ok: res.ok,
                status: res.status,
                data,
                error: res.ok ? '' : data?.error || `Request failed (${res.status}).`,
              };
            } catch (err) {
              lastErr = err;
              if (attempt < maxRetries) {
                await new Promise((r) => setTimeout(r, 500 * (attempt + 1)));
                continue;
              }
            }
          }

          return {
            ok: false,
            status: 0,
            data: null,
            error:
              lastErr?.message && !/failed to fetch/i.test(lastErr.message)
                ? `Connection issue: ${lastErr.message}`
                : 'Could not reach the StayGrid server. Please wait a moment and try again.',
          };
        }

        function getPasswordStrength(pw) {
          const val = String(pw || '');
          if (!val) return { score: 0, label: '', barClass: 'bg-slate-200 w-0' };
          let score = 0;
          if (val.length >= 8) score += 1;
          if (/[A-Z]/.test(val) && /[a-z]/.test(val)) score += 1;
          if (/\d/.test(val)) score += 1;
          if (/[^A-Za-z0-9]/.test(val) || val.length >= 12) score += 1;
          if (score <= 1) return { score: 1, label: 'Weak (use 8+ chars with letters & numbers)', barClass: 'bg-rose-500 w-1/4' };
          if (score === 2) return { score: 2, label: 'Fair', barClass: 'bg-amber-500 w-2/4' };
          if (score === 3) return { score: 3, label: 'Good', barClass: 'bg-cyan-500 w-3/4' };
          return { score: 4, label: 'Strong', barClass: 'bg-emerald-500 w-full' };
        }

        function bindAuthGateEvents(main) {
          main.querySelectorAll('[data-auth-mode], [data-auth-switch-mode]').forEach((btn) => {
            btn.addEventListener('click', () => {
              const mode = btn.getAttribute('data-auth-mode') || btn.getAttribute('data-auth-switch-mode');
              if (mode === 'login' || mode === 'register') {
                state.auth.mode = mode;
                state.auth.error = '';
                state.auth.roleMismatchTarget = null;
                render();
              }
            });
          });

          main.querySelectorAll('[data-auth-role]').forEach((btn) => {
            btn.addEventListener('click', () => {
              const role = btn.getAttribute('data-auth-role');
              if (role === 'student' || role === 'landlord') {
                state.auth.selectedRole = role;
                state.auth.error = '';
                state.auth.roleMismatchTarget = null;
                render();
              }
            });
          });

          main.querySelector('#auth-switch-mismatch-role-btn')?.addEventListener('click', (e) => {
            const target = e.currentTarget.getAttribute('data-target-role');
            if (target === 'student' || target === 'landlord') {
              state.auth.selectedRole = target;
              state.auth.error = '';
              state.auth.roleMismatchTarget = null;
              render();
            }
          });

          main.querySelector('#auth-toggle-pw-btn')?.addEventListener('click', () => {
            state.auth.showPassword = !state.auth.showPassword;
            render();
          });

          main.querySelector('#auth-toggle-confirm-pw-btn')?.addEventListener('click', () => {
            state.auth.showConfirmPassword = !state.auth.showConfirmPassword;
            render();
          });

          main.querySelectorAll('[data-login-field]').forEach((el) => {
            el.addEventListener('input', (e) => {
              const key = el.getAttribute('data-login-field');
              state.auth.loginForm[key] = e.target.value;
              if (state.auth.error) {
                state.auth.error = '';
                state.auth.roleMismatchTarget = null;
              }
            });
          });

          main.querySelectorAll('[data-reg-field]').forEach((el) => {
            el.addEventListener('input', (e) => {
              const key = el.getAttribute('data-reg-field');
              state.auth.registerForm[key] = e.target.value;
              if (state.auth.error) state.auth.error = '';
              if (key === 'password') {
                const wrap = document.getElementById('auth-pw-strength-wrap');
                if (wrap) {
                  const strength = getPasswordStrength(e.target.value);
                  wrap.innerHTML = e.target.value
                    ? `
                        <div class="h-1 w-full overflow-hidden rounded-full bg-slate-200">
                          <div class="h-full transition-all ${strength.barClass}"></div>
                        </div>
                        <p class="mt-1 text-[11px] text-slate-500">${escapeHtml(strength.label)}</p>
                      `
                    : '';
                }
              }
            });
          });

          main.querySelectorAll('[data-reg-choice]').forEach((btn) => {
            btn.addEventListener('click', () => {
              const field = btn.getAttribute('data-reg-choice');
              const val = btn.getAttribute('data-reg-value');
              if (field && val) {
                state.auth.registerForm[field] = val;
                render();
              }
            });
          });

          // Auto Location buttons on Registration screen (Student & Landlord)
          const bindRegAutoLocation = (btnId, fieldName, inputId) => {
            const btn = main.querySelector(`#${btnId}`);
            if (!btn) return;
            btn.addEventListener('click', async () => {
              const labelSpan = btn.querySelector('span');
              const orig = labelSpan ? labelSpan.textContent : 'Auto Location';
              btn.disabled = true;
              if (labelSpan) labelSpan.textContent = 'Locating...';
              try {
                const res = await StayGridMaps.detectAutoLocation();
                state.auth.registerForm[fieldName] = res.locationLabel;
                state.auth.registerForm.detectedCoords = res.coords;
                state.auth.registerForm.detectedFormattedAddress = res.formattedAddress;
                const inp = document.getElementById(inputId);
                if (inp) inp.value = res.locationLabel;
                showToast('Auto Location detected', res.locationLabel, 'success');
              } catch (err) {
                showToast('Auto Location unavailable', err?.message || 'Could not detect your location.', 'error');
              } finally {
                btn.disabled = false;
                if (labelSpan) labelSpan.textContent = orig;
              }
            });
          };
          bindRegAutoLocation('auth-reg-auto-loc-btn', 'preferredLocation', 'auth-reg-location');
          bindRegAutoLocation('auth-reg-auto-city-btn', 'operatingCity', 'auth-reg-city');

          // Login Form Submit
          main.querySelector('#auth-login-form')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (state.auth.submitting) return;
            const liveEmail = document.getElementById('auth-login-email')?.value;
            const livePassword = document.getElementById('auth-login-password')?.value;
            if (typeof liveEmail === 'string') state.auth.loginForm.email = liveEmail;
            if (typeof livePassword === 'string') state.auth.loginForm.password = livePassword;

            const email = (state.auth.loginForm.email || '').trim().toLowerCase();
            const password = state.auth.loginForm.password || '';

            if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
              state.auth.error = 'Please enter a valid email address.';
              render();
              return;
            }
            if (!password) {
              state.auth.error = 'Please enter your password.';
              render();
              return;
            }

            state.auth.submitting = true;
            state.auth.error = '';
            state.auth.roleMismatchTarget = null;
            render();

            const result = await apiRequestJson('/api/auth/login', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                email,
                password,
                expectedRole: state.auth.selectedRole,
              }),
            });

            if (!result.ok || !result.data?.token || !result.data?.user) {
              state.auth.error = result.error || 'Unable to sign in. Please check your credentials.';
              state.auth.roleMismatchTarget = result.data?.actualRole || null;
              state.auth.submitting = false;
              render();
              return;
            }

            const data = result.data;
            authToken = data.token;
            state.auth.user = data.user;
            state.auth.submitting = false;
            state.auth.error = '';
            state.auth.loginForm.password = '';
            try {
              syncAuthenticatedUserToPortals(data.user);
            } catch {}
            state.role = data.user.role === 'landlord' ? 'landlord' : 'tenant';
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            showToast(
              `Welcome back, ${data.user.profile?.fullName || data.user.email}`,
              data.user.role === 'landlord'
                ? 'Signed in to StayGrid Landlord Studio.'
                : 'Signed in to StayGrid Student & Tenant Portal.',
              'success'
            );
          });

          // Register Form Submit
          main.querySelector('#auth-register-form')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (state.auth.submitting) return;
            const rf = state.auth.registerForm;
            const role = state.auth.selectedRole;

            // Sync live DOM input values (supports browser autofill)
            main.querySelectorAll('[data-reg-field]').forEach((el) => {
              const key = el.getAttribute('data-reg-field');
              if (key && typeof el.value === 'string') {
                rf[key] = el.value;
              }
            });

            const fullName = (rf.fullName || '').trim();
            const email = (rf.email || '').trim().toLowerCase();
            const phone = (rf.phone || '').trim();
            const password = rf.password || '';
            const confirmPassword = rf.confirmPassword || '';

            if (fullName.length < 2) {
              state.auth.error = 'Please enter your full name.';
              render();
              return;
            }
            if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) {
              state.auth.error = 'Please enter a valid email address.';
              render();
              return;
            }
            if (phone.replace(/\D/g, '').length < 10) {
              state.auth.error = 'Please enter a valid 10-digit mobile number.';
              render();
              return;
            }
            if (password.length < 8) {
              state.auth.error = 'Password must be at least 8 characters long.';
              render();
              return;
            }
            if (password !== confirmPassword) {
              state.auth.error = 'Passwords do not match. Please re-enter your password.';
              render();
              return;
            }

            const payload = {
              role,
              fullName,
              email,
              phone,
              password,
            };

            if (role === 'student') {
              if ((rf.collegeName || '').trim().length < 2) {
                state.auth.error = 'Please enter your college or university name.';
                render();
                return;
              }
              if ((rf.courseYear || '').trim().length < 2) {
                state.auth.error = 'Please enter your course and year of study.';
                render();
                return;
              }
              if ((rf.preferredLocation || '').trim().length < 2) {
                state.auth.error = 'Please enter your preferred city or neighborhood.';
                render();
                return;
              }
              payload.collegeName = rf.collegeName.trim();
              payload.courseYear = rf.courseYear.trim();
              payload.preferredLocation = rf.preferredLocation.trim();
              payload.preferredCategory = rf.preferredCategory || 'hostel';
              payload.genderPreference = rf.genderPreference || 'Co-living';
              if ((rf.guardianPhone || '').trim()) {
                payload.guardianPhone = rf.guardianPhone.trim();
              }
            } else {
              if ((rf.businessName || '').trim().length < 2) {
                state.auth.error = 'Please enter your PG, hostel, or property business name.';
                render();
                return;
              }
              if ((rf.operatingCity || '').trim().length < 2) {
                state.auth.error = 'Please enter the operating city or neighborhood.';
                render();
                return;
              }
              payload.businessName = rf.businessName.trim();
              payload.operatingCity = rf.operatingCity.trim();
              payload.propertyFocus = rf.propertyFocus || 'hostel';
              if (String(rf.totalUnits || '').trim() !== '') {
                payload.totalUnits = Number(rf.totalUnits);
              }
              if ((rf.businessRegId || '').trim()) {
                payload.businessRegId = rf.businessRegId.trim();
              }
            }

            state.auth.submitting = true;
            state.auth.error = '';
            render();

            const result = await apiRequestJson('/api/auth/register', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify(payload),
            });

            if (!result.ok || !result.data?.token || !result.data?.user) {
              state.auth.error = result.error || 'Could not complete registration. Please check your details.';
              state.auth.submitting = false;
              render();
              return;
            }

            const data = result.data;
            authToken = data.token;
            state.auth.user = data.user;
            state.auth.submitting = false;
            state.auth.error = '';
            state.auth.registerForm.password = '';
            state.auth.registerForm.confirmPassword = '';
            try {
              syncAuthenticatedUserToPortals(data.user);
            } catch {}
            state.role = data.user.role === 'landlord' ? 'landlord' : 'tenant';
            render();
            window.scrollTo({ top: 0, behavior: 'smooth' });
            showToast(
              'Account created successfully',
              data.user.role === 'landlord'
                ? `Welcome ${data.user.profile?.fullName}! Your Landlord Studio is ready.`
                : `Welcome ${data.user.profile?.fullName}! Your Student Portal is ready.`,
              'success'
            );
          });
        }

        // =========================================================================
        // 6. CHART.JS LIVE OCCUPANCY DOUGHNUT
        // =========================================================================
        function destroyOccupancyChart() {
          if (occupancyChartInstance) {
            occupancyChartInstance.destroy();
            occupancyChartInstance = null;
          }
        }

        function renderOrUpdateOccupancyChart() {
          const canvas = document.getElementById('occupancy-doughnut-canvas');
          if (!canvas || typeof window.Chart === 'undefined') return;

          const stats = getPropertyStats(state.landlord.draft);
          const total = stats.availableRooms + stats.occupiedRooms;
          const hasRooms = total > 0;
          const isDark = document.documentElement.classList.contains('theme-dark');
          const dataValues = hasRooms ? [stats.availableRooms, stats.occupiedRooms] : [1];
          const labels = hasRooms ? ['Available', 'Occupied'] : ['No rooms yet'];
          const bgColors = hasRooms ? ['#10B981', '#F43F5E'] : [isDark ? '#1E3A5F' : '#E2E8F0'];
          const hoverColors = hasRooms ? ['#059669', '#E11D48'] : [isDark ? '#2A4E7C' : '#CBD5E1'];
          const ringBorderColor = isDark ? '#071834' : '#FFFFFF';

          const pctEl = document.getElementById('chart-center-pct');
          const availEl = document.getElementById('chart-legend-available');
          const occEl = document.getElementById('chart-legend-occupied');
          if (pctEl) pctEl.textContent = hasRooms ? `${stats.occupancyRate}%` : '—';
          if (availEl) availEl.textContent = String(stats.availableRooms);
          if (occEl) occEl.textContent = String(stats.occupiedRooms);

          if (occupancyChartInstance && occupancyChartInstance.canvas === canvas) {
            occupancyChartInstance.data.labels = labels;
            occupancyChartInstance.data.datasets[0].data = dataValues;
            occupancyChartInstance.data.datasets[0].backgroundColor = bgColors;
            occupancyChartInstance.data.datasets[0].hoverBackgroundColor = hoverColors;
            occupancyChartInstance.data.datasets[0].borderColor = ringBorderColor;
            occupancyChartInstance.update('active');
            return;
          }

          destroyOccupancyChart();
          occupancyChartInstance = new window.Chart(canvas, {
            type: 'doughnut',
            data: {
              labels,
              datasets: [
                {
                  data: dataValues,
                  backgroundColor: bgColors,
                  hoverBackgroundColor: hoverColors,
                  borderWidth: 2,
                  borderColor: ringBorderColor,
                  hoverOffset: 3,
                },
              ],
            },
            options: {
              responsive: true,
              maintainAspectRatio: true,
              cutout: '72%',
              animation: { duration: 300 },
              plugins: {
                legend: { display: false },
                tooltip: {
                  enabled: true,
                  backgroundColor: '#0F172A',
                  padding: 10,
                  cornerRadius: 8,
                  callbacks: {
                    label(ctx) {
                      if (!hasRooms) return ' Add rooms to track occupancy';
                      const val = Number(ctx.parsed) || 0;
                      const pct = total > 0 ? Math.round((val / total) * 100) : 0;
                      return ` ${ctx.label}: ${val} room${val === 1 ? '' : 's'} (${pct}%)`;
                    },
                  },
                },
              },
            },
          });
        }
