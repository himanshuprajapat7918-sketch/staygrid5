                <div class="mt-5 space-y-3">
                  <p class="text-xs font-bold uppercase tracking-wider text-slate-500">Published Notices (${(state.notices || []).length})</p>
                  ${noticesListHtml}
                </div>
              </section>

              <!-- 4. INTERACTIVE GOOGLE MAP & NEARBY VENDORS (LANDLORD) -->
              <section id="landlord-map-section" class="rounded-2xl border border-slate-200 bg-white p-6">
                <div class="flex flex-col justify-between gap-3 border-b border-slate-100 pb-4 sm:flex-row sm:items-center">
                  <div>
                    <h3 class="font-display text-lg font-bold text-slate-900">Property Location &amp; Nearby Services Map</h3>
                    <p class="mt-0.5 text-xs text-slate-500">Live Google Maps view for <span class="font-semibold text-slate-800">${escapeHtml(draft.location || 'your property')}</span> with Places API (New) vendor lookup.</p>
                  </div>
                  <div class="flex flex-wrap items-center gap-2">
                    ${['Plumber', 'Electrician', 'Hardware Store', 'Colleges']
                      .map(
                        (q) => `
                        <button
                          type="button"
                          data-landlord-map-search="${q}"
                          class="rounded-lg border border-slate-300 bg-white px-3 py-1.5 text-xs font-semibold text-slate-700 transition-colors hover:border-indigo-500 hover:bg-indigo-50 hover:text-indigo-800"
                        >
                          Find ${q}
                        </button>
                      `
                      )
                      .join('')}
                  </div>
                </div>

                <div id="landlord-google-map" class="mt-4 h-[360px] w-full overflow-hidden rounded-xl border border-slate-200 bg-slate-900"></div>

                ${mapLoading ? `<p class="mt-3 text-xs font-medium text-indigo-700">Searching Google Maps Places nearby...</p>` : ''}
                ${mapError ? `<p class="mt-3 text-xs font-medium text-rose-600">${escapeHtml(mapError)}</p>` : ''}
                ${
                  mapPlaces && mapPlaces.length > 0
                    ? `<div class="mt-4">
                        <p class="mb-2 text-xs font-bold uppercase tracking-wider text-slate-500">Live Google Maps Results: ${escapeHtml(mapQueryLabel)}</p>
                        <div class="grid grid-cols-1 gap-2.5 sm:grid-cols-2 lg:grid-cols-3">
                          ${mapPlaces
                            .map(
                              (pl) => `
                              <div class="rounded-xl border border-slate-200 bg-slate-50/70 p-3 text-xs">
                                <p class="font-bold text-slate-900">${escapeHtml(pl.name)}</p>
                                <p class="mt-0.5 line-clamp-2 text-[11px] text-slate-600">${escapeHtml(pl.address)}</p>
                                <div class="mt-2 flex items-center justify-between">
                                  <span class="font-mono text-[11px] font-semibold text-amber-700">${pl.rating ? `★ ${pl.rating}` : 'Google Place'}</span>
                                  ${pl.uri ? `<a href="${escapeHtml(pl.uri)}" target="_blank" rel="noopener noreferrer" class="font-semibold text-indigo-700 hover:underline">Maps →</a>` : ''}
                                </div>
                              </div>
                            `
                            )
                            .join('')}

                      </div>`
                    : ''
                }
              </section>
            </div>
          `;
        }

        // =========================================================================
        // 9. VIEW 3: STUDENT / TENANT PORTAL (WITH PREDICTIVE TYPING SEARCH)
        // =========================================================================
        function getPredictiveSuggestions(query, activeLocation, category) {
          const q = query.trim().toLowerCase();
          if (!q) return [];
          const locNeedle = (activeLocation || '').toLowerCase();
          return state.properties
            .filter((p) => getPropertyType(p) === category && p.name.toLowerCase().includes(q))
            .sort((a, b) => {
              const aStarts = a.name.toLowerCase().startsWith(q) ? 1 : 0;
              const bStarts = b.name.toLowerCase().startsWith(q) ? 1 : 0;
              if (aStarts !== bStarts) return bStarts - aStarts;
              const aInLoc = locNeedle && a.location.toLowerCase().includes(locNeedle) ? 1 : 0;
              const bInLoc = locNeedle && b.location.toLowerCase().includes(locNeedle) ? 1 : 0;
              if (aInLoc !== bInLoc) return bInLoc - aInLoc;
              return a.name.localeCompare(b.name);
            })
            .slice(0, 6);
        }

        function getInlinePrediction(rawQuery, suggestions) {
          if (!rawQuery.trim() || suggestions.length === 0) return '';
          const topName = suggestions[0].name;
          if (topName.toLowerCase().startsWith(rawQuery.toLowerCase())) {
            return rawQuery + topName.slice(rawQuery.length);
          }
          return '';
        }

        function countActiveTenantFilters() {
          const f = state.tenant.filters;
          let count = 0;
          if (f.priceRange !== 'all') count += 1;
          if (f.utilities.electricity) count += 1;
          if (f.utilities.water) count += 1;
          if (f.utilities.gas) count += 1;
          count += (f.genders || []).length;
          count += (f.sharings || []).length;
          count += (f.roomTypes || []).length;
          for (const am of AMENITY_OPTIONS) {
            if (f.amenities?.[am.key]) count += 1;
          }
          return count;
        }

        function hasActiveTenantFilters() {
          return countActiveTenantFilters() > 0;
        }

        function propertyMatchesTenantFilters(property) {
          const f = state.tenant.filters;
          if (f.genders && f.genders.length > 0) {
            const pGender = property.gender || 'Co-living';
            if (!f.genders.includes(pGender)) return false;
          }
          for (const am of AMENITY_OPTIONS) {
            if (f.amenities?.[am.key] && !property.amenities?.[am.key]) return false;
          }
          return true;
        }

        function roomMatchesTenantFilters(room) {
          const f = state.tenant.filters;
          const rent = Number(room.rent) || 0;
          if (f.priceRange === 'under5k' && !(rent < 5000)) return false;
          if (f.priceRange === '5kto10k' && !(rent >= 5000 && rent <= 10000)) return false;
          if (f.priceRange === 'above10k' && !(rent > 10000)) return false;

          if (f.utilities.electricity && !room.utilities?.electricity) return false;
          if (f.utilities.water && !room.utilities?.water) return false;
          if (f.utilities.gas && !room.utilities?.gas) return false;

          if (f.sharings && f.sharings.length > 0) {
            if (!f.sharings.includes(room.sharing || 'Single')) return false;
          }
          if (f.roomTypes && f.roomTypes.length > 0) {
            if (!f.roomTypes.includes(room.roomType || 'AC')) return false;
          }
          return true;
        }

        function getMatchingRoomsForProperty(property) {
          const matched = [];
          for (const floor of property.floors || []) {
            for (const room of floor.rooms || []) {
              if (roomMatchesTenantFilters(room)) {
                matched.push(room);
              }
            }
          }
          return matched;
        }

        function getActiveFilterSummaryText() {
          const parts = [];
          const f = state.tenant.filters;
          if (f.genders && f.genders.length > 0) parts.push(`Gender: ${f.genders.join(' / ')}`);
          if (f.sharings && f.sharings.length > 0) parts.push(`Sharing: ${f.sharings.join(' / ')}`);
          if (f.roomTypes && f.roomTypes.length > 0) parts.push(`Room: ${f.roomTypes.join(' / ')}`);
          const activeAms = AMENITY_OPTIONS.filter((am) => f.amenities?.[am.key]).map((am) => am.label);
          if (activeAms.length > 0) parts.push(activeAms.join(', '));

          const pr = f.priceRange;
          if (pr === 'under5k') parts.push('Rent < ₹5,000');
          else if (pr === '5kto10k') parts.push('Rent ₹5,000–₹10,000');
          else if (pr === 'above10k') parts.push('Rent > ₹10,000');

          const u = f.utilities;
          if (u.electricity) parts.push('Electricity Included');
          if (u.water) parts.push('Water Included');
          if (u.gas) parts.push('Gas Included');
          return parts.join(' · ');
        }

        function getTenantDisplayedProperties() {
          const category = state.tenant.activeCategory;
          const catProps = state.properties.filter((p) => getPropertyType(p) === category);
          const activeLocation = (state.tenantProfile?.preferredLocation || state.tenant.formValues.preferredLocation || '').trim();
          const preferredCoords = state.tenantProfile?.preferredCoords || state.tenant.formValues.preferredCoords || null;
          const locNeedle = activeLocation.toLowerCase();
          const locTokens = locNeedle
            .split(/[,|-]+/)
            .map((t) => t.trim())
            .filter((t) => t.length >= 3 && !['india', 'near', 'road', 'sector', 'phase', 'block'].includes(t));

          let locMatched = catProps;
          if (locNeedle) {
            const direct = catProps.filter((p) => {
              const pLoc = (p.location || '').toLowerCase();
              const pAddr = (p.formattedAddress || '').toLowerCase();
              if (pLoc.includes(locNeedle) || pAddr.includes(locNeedle)) return true;
              return locTokens.some((tok) => pLoc.includes(tok) || pAddr.includes(tok));
            });

            if (isValidCoords(preferredCoords)) {
              const nearbyByCoords = catProps.filter(
                (p) => haversineDistanceKm(preferredCoords, getPropertyCoords(p)) <= 30
              );
              const mergedIds = new Set([...direct.map((p) => p.id), ...nearbyByCoords.map((p) => p.id)]);
              locMatched = catProps
                .filter((p) => mergedIds.has(p.id))
                .sort(
                  (a, b) =>
                    haversineDistanceKm(preferredCoords, getPropertyCoords(a)) -
                    haversineDistanceKm(preferredCoords, getPropertyCoords(b))
                );
            } else {
              locMatched = direct;
            }
          }

          const q = state.tenant.hostelQuery.trim().toLowerCase();
          let list = locMatched;
          if (q) {
            const inLoc = locMatched.filter((p) => p.name.toLowerCase().includes(q));
            list = inLoc.length > 0 ? inLoc : catProps.filter((p) => p.name.toLowerCase().includes(q));
          }

          if (!hasActiveTenantFilters()) return list;
          return list.filter(
            (p) => propertyMatchesTenantFilters(p) && getMatchingRoomsForProperty(p).length > 0
          );
        }

        function renderTenantResultsHtml() {
          const category = state.tenant.activeCategory;
          const isFlat = category === 'flat';
          const filtersActive = hasActiveTenantFilters();
          const filterSummary = getActiveFilterSummaryText();
          const activeLocation = (state.tenantProfile?.preferredLocation || state.tenant.formValues.preferredLocation || '').trim();
          const availableLocations = Array.from(
            new Set(
              state.properties
                .filter((p) => getPropertyType(p) === category)
                .map((p) => p.location.trim())
                .filter(Boolean)
            )
          );
          const displayed = getTenantDisplayedProperties();
          const q = state.tenant.hostelQuery.trim();

          const headingText = q
            ? `Search Results for “${escapeHtml(q)}”`
            : `${isFlat ? 'Flats Near Me' : 'College Hostels'} in ${escapeHtml(activeLocation || 'All Locations')}`;
          const countLabel = `${displayed.length} ${displayed.length === 1 ? 'property' : 'properties'} found`;

          if (displayed.length === 0) {
            return `
              <div class="mb-5 flex flex-wrap items-baseline justify-between gap-2">
                <div>
                  <h2 class="font-display text-lg font-bold text-slate-900">${headingText}</h2>
                  ${filtersActive ? `<p class="mt-0.5 text-xs text-slate-500">Filtered by: ${escapeHtml(filterSummary)}</p>` : ''}
                </div>
                <span class="text-xs font-medium text-slate-500">${countLabel}</span>
              </div>
              <div class="flex flex-col items-center justify-center rounded-2xl border border-dashed border-slate-300 bg-white px-6 py-14 text-center">
                <h3 class="font-display text-base font-bold text-slate-900">No ${isFlat ? 'flats or local homes' : 'college hostels'} match your criteria</h3>
                <p class="mt-1 max-w-md text-sm text-slate-600">
                  ${
                    filtersActive
                      ? `No ${isFlat ? 'flats' : 'rooms'} in this view match your active filters (${escapeHtml(filterSummary)}). Try resetting filters or widening your price range.`
                      : q
                      ? `We could not find any ${isFlat ? 'flat listing' : 'college hostel'} matching “${escapeHtml(q)}”. Clear the search or explore one of our active neighborhoods below.`
                      : `There are currently no listed ${isFlat ? 'flats near' : 'college hostels in'} “${escapeHtml(activeLocation)}”. Try one of our active locations below or switch to ${isFlat ? 'College Hostels' : 'Flats Near Me'}.`
                  }
                </p>
                <div class="mt-5 flex flex-wrap items-center justify-center gap-2">
                  ${
                    filtersActive
                      ? `<button type="button" id="empty-reset-filters-btn" class="min-h-[38px] whitespace-nowrap rounded-lg bg-indigo-600 px-4 py-1.5 text-xs font-semibold text-white hover:bg-indigo-700">Reset Filters</button>`
                      : ''
                  }
                  ${
                    q
                      ? `<button type="button" id="empty-clear-search-btn" class="min-h-[38px] whitespace-nowrap rounded-lg bg-slate-900 px-4 py-1.5 text-xs font-semibold text-white hover:bg-slate-800">Clear Search</button>`
                      : ''
                  }
                  ${availableLocations
                    .map(
                      (loc) =>
                        `<button type="button" data-quick-location="${escapeHtml(loc)}" class="min-h-[38px] whitespace-nowrap rounded-lg border border-slate-300 bg-white px-3.5 py-1.5 text-xs font-semibold text-slate-700 transition-colors hover:border-indigo-400 hover:text-indigo-700">Explore ${escapeHtml(loc)}</button>`
                    )
                    .join('')}
                </div>
              </div>
            `;
          }

          const cardsHtml = displayed
            .map((property) => {
              const pStats = getPropertyStats(property);
              const matchedRooms = filtersActive ? getMatchingRoomsForProperty(property) : null;
              const matchedAvail = matchedRooms
                ? matchedRooms.filter((r) => r.status === 'available').length
                : pStats.availableRooms;
              const matchedMinRent =
                matchedRooms && matchedRooms.length > 0
                  ? Math.min(...matchedRooms.map((r) => Number(r.rent) || 0).filter((v) => v > 0))
                  : pStats.minRent;
              const unitNoun = getPropertyType(property) === 'flat' ? 'flats' : 'rooms';
              const cover = getPropertyCoverImage(property);
              const isExpanded = state.tenant.expandedPropertyId === property.id;

              const floorGridHtml = isExpanded
                ? `
                  <div class="border-t border-slate-200 bg-slate-50/75 p-6">
                    <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
                      <div>
                        <h4 class="font-display text-base font-bold text-slate-900">Interactive 2D Floor Plan — ${escapeHtml(property.name)}</h4>
                        <p class="text-xs text-slate-500">
                          ${
                            filtersActive
                              ? `Showing ${matchedRooms.length} of ${pStats.totalRooms} ${unitNoun} matching active filters (${escapeHtml(filterSummary)}).`
                              : `Select any ${getPropertyType(property) === 'flat' ? 'flat' : 'room'} box to view full gallery, utility inclusions, and landlord notes.`
                          }
                        </p>
                      </div>
                      <div class="flex items-center gap-4 text-xs font-medium">
                        <span class="flex items-center gap-1.5 text-emerald-700">
                          <span class="h-2.5 w-2.5 rounded-sm border border-emerald-400 bg-emerald-100" aria-hidden="true"></span>
                          Available
                        </span>
                        <span class="flex items-center gap-1.5 text-rose-700">
                          <span class="h-2.5 w-2.5 rounded-sm border border-rose-400 bg-rose-100" aria-hidden="true"></span>
                          Occupied
                        </span>
                      </div>
                    </div>

                    <div class="space-y-6">
                      ${property.floors
                        .map((floor) => {
                          const visibleRooms = filtersActive
                            ? floor.rooms.filter((r) => roomMatchesTenantFilters(r))
                            : floor.rooms;
                          if (visibleRooms.length === 0) return '';
                          const flAvail = visibleRooms.filter((r) => r.status === 'available').length;
                          return `
                            <div>
                              <div class="mb-3 flex items-center justify-between border-b border-slate-200 pb-2">
                                <h5 class="font-display text-sm font-bold text-slate-900">${escapeHtml(floor.name)}</h5>
                                <span class="font-mono text-xs text-slate-500 tabular-nums">${flAvail} of ${visibleRooms.length} ${filtersActive ? 'matching ' : ''}available</span>
                              </div>
                              <div class="grid grid-cols-2 gap-3 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6">
                                ${visibleRooms
                                  .map((room) => {
                                    const isAvail = room.status === 'available';
                                    const requested = state.visitRequests.some(
                                      (vr) => vr.propertyId === property.id && vr.roomId === room.id
                                    );
                                    return `
                                      <button
                                        type="button"
                                        data-open-room-detail="${escapeHtml(property.id)}::${escapeHtml(floor.id)}::${escapeHtml(room.id)}"
                                        class="room-tile ${isAvail ? 'room-tile-available' : 'room-tile-occupied'} flex flex-col justify-between rounded-xl border p-3.5 text-left transition-all duration-150 hover:-translate-y-0.5 hover:shadow-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-600 ${
                                          isAvail
                                            ? 'border-emerald-300 bg-emerald-50/75 hover:border-emerald-500'
                                            : 'border-rose-300 bg-rose-50/75 hover:border-rose-400'
                                        }"
                                      >
                                        <div class="flex items-center justify-between gap-2">
                                          <span class="font-mono text-base font-bold text-slate-900 tabular-nums">${escapeHtml(room.label)}</span>
                                          <span class="text-[11px] font-semibold ${isAvail ? 'text-emerald-700' : 'text-rose-700'}">
                                            ${isAvail ? 'Available' : 'Occupied'}
                                          </span>
                                        </div>
                                        <div class="mt-2.5">
                                          <p class="font-mono text-sm font-semibold text-slate-900 tabular-nums">
                                            ${escapeHtml(formatINR(room.rent))}<span class="font-sans text-[11px] font-normal text-slate-500">/mo</span>
                                          </p>
                                          <p class="mt-1 text-[11px] font-medium text-slate-600">
                                            ${escapeHtml(room.sharing || 'Single')} · ${escapeHtml(room.roomType || 'AC')}
                                          </p>
                                          ${(() => {
                                            const rSum = getRoomRatingSummary(property.id, room.id);
                                            return rSum.count > 0
                                              ? `<p class="mt-1 flex items-center gap-1 font-mono text-[11px] font-semibold text-amber-700">★ ${rSum.avg} <span class="font-sans font-normal text-slate-500">(${rSum.count})</span></p>`
                                              : `<p class="mt-1 text-[11px] text-slate-500">${requested ? 'Visit requested' : `Inspect ${getPropertyType(property) === 'flat' ? 'flat' : 'room'}`}</p>`;
                                          })()}
                                        </div>
                                      </button>
                                    `;
                                  })
                                  .join('')}
                              </div>
                            </div>
                          `;
                        })
                        .join('')}
                    </div>
                  </div>
                `
                : '';

              return `
                <article class="overflow-hidden rounded-2xl border border-slate-200 bg-white transition-shadow hover:shadow-sm">
                  <div class="grid grid-cols-1 lg:grid-cols-12">
                    <div class="h-52 bg-slate-100 lg:col-span-4 lg:h-full">
                      ${renderImageMarkup(cover, `${property.name} room preview`, property.name)}
                    </div>
                    <div class="flex flex-col justify-between p-6 lg:col-span-8">
                      <div>
                        <div class="flex flex-wrap items-start justify-between gap-4">
                          <div>
                            <div class="flex flex-wrap items-center gap-2">
                              <p class="text-xs font-medium text-indigo-600">${getPropertyType(property) === 'flat' ? 'Flats Near Me · Local Residential House' : 'College Hostel / PG'}</p>
                              <span class="rounded-full border border-cyan-300/70 bg-cyan-50 px-2.5 py-0.5 text-[11px] font-semibold text-navy-900">${escapeHtml(property.gender || 'Co-living')}</span>
                            </div>
                            <h3 class="mt-1 font-display text-xl font-bold text-slate-900">${escapeHtml(property.name)}</h3>
                            <div class="mt-1 flex flex-wrap items-center gap-x-2.5 gap-y-1 text-sm text-slate-600">
                              <span>${escapeHtml(property.location)}</span>
                              ${(() => {
                                const prefCoords = state.tenantProfile?.preferredCoords || state.tenant.formValues.preferredCoords;
                                const pCoords = getPropertyCoords(property);
                                const km = isValidCoords(prefCoords) ? haversineDistanceKm(prefCoords, pCoords) : Infinity;
                                const distBadge =
                                  Number.isFinite(km) && km < 100
                                    ? `<span class="rounded-full border border-emerald-200 bg-emerald-50 px-2 py-0.5 font-mono text-[11px] font-semibold text-emerald-800 tabular-nums">${km < 1 ? `${Math.max(100, Math.round(km * 1000))} m` : `${km.toFixed(1)} km`} from your pin</span>`
                                    : isValidCoords(property.coords)
                                    ? `<span class="rounded-full border border-cyan-200 bg-cyan-50 px-2 py-0.5 text-[11px] font-semibold text-navy-900">Map Pinned</span>`
                                    : '';
                                const mapHref = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${pCoords.lat},${pCoords.lng}`)}`;
                                return `${distBadge} <a href="${mapHref}" target="_blank" rel="noopener noreferrer" class="text-xs font-semibold text-indigo-700 hover:underline">Open Pin ↗</a>`;
                              })()}
                            </div>
                          </div>
                          <div class="text-left sm:text-right">
                            <p class="text-xs text-slate-500">${filtersActive ? 'Matching from' : 'Starting from'}</p>
                            <p class="font-mono text-xl font-bold text-slate-900 tabular-nums">
                              ${Number.isFinite(matchedMinRent) && matchedMinRent > 0 ? escapeHtml(formatINR(matchedMinRent)) : '—'}<span class="font-sans text-xs font-normal text-slate-500">/mo</span>
                            </p>
                          </div>
                        </div>

                        <div class="mt-4 flex flex-wrap items-center gap-x-4 gap-y-1.5 border-y border-slate-100 py-3 text-sm">
                          ${
                            filtersActive

        function updatePredictiveUiOnly() {
          const activeLocation = (state.tenantProfile?.preferredLocation || state.tenant.formValues.preferredLocation || '').trim();

            } else {
              ghostEl.innerHTML = '';
            }
          }
          if (tabHint) {
            tabHint.classList.toggle('hidden', !(inlinePred && inlinePred !== state.tenant.hostelQuery));
          }
          if (clearBtn) {
            clearBtn.classList.toggle('hidden', !state.tenant.hostelQuery);
          }

          // Update predictive dropdown
          const dropdown = document.getElementById('hostel-predictions-listbox');
          if (dropdown) {
            if (state.tenant.isDropdownOpen && suggestions.length > 0) {
              dropdown.classList.remove('hidden');
              dropdown.innerHTML = suggestions

                  return `

                      data-select-prediction="${escapeHtml(prop.id)}"
                      data-prediction-idx="${idx}"
                      class="flex cursor-pointer items-center justify-between gap-4 px-4 py-2.5 text-sm transition-colors ${isHi ? 'bg-indigo-50/80' : 'hover:bg-slate-50'}"

                      </div>
                      <span class="shrink-0 font-mono text-xs font-medium text-emerald-700 tabular-nums">${pStats.availableRooms} avail.</span>
                    </li>

                .join('');

              dropdown.classList.add('hidden');
              dropdown.innerHTML = '';
            }
          }

          // Update results container without touching search input focus!
          const resultsSection = document.getElementById('tenant-results-section');
          if (resultsSection) {
            resultsSection.innerHTML = renderTenantResultsHtml();

        // =========================================================================

        function bindRoomEditorModalEvents() {
          const backdrop = document.getElementById('modal-backdrop');
          if (backdrop) {
            backdrop.addEventListener('click', (e) => {
              if (e.target === backdrop) closeModals();
            });
          }
          document.querySelectorAll('[data-close-modal]').forEach((btn) => {
            btn.addEventListener('click', closeModals);
          });

          const md = state.landlord.modalDraft;
          if (!md) return;

          const labelInput = document.getElementById('room-label-input');
          const rentInput = document.getElementById('room-rent-input');
          const notesInput = document.getElementById('room-maintenance-input');
          const utilElec = document.getElementById('util-electricity');
          const utilWater = document.getElementById('util-water');
          const utilGas = document.getElementById('util-gas');

          labelInput?.addEventListener('input', (e) => { md.label = e.target.value; });
          rentInput?.addEventListener('input', (e) => { md.rent = e.target.value; });
          notesInput?.addEventListener('input', (e) => { md.maintenanceNotes = e.target.value; });
          utilElec?.addEventListener('change', (e) => { md.utilities.electricity = e.target.checked; });
          utilWater?.addEventListener('change', (e) => { md.utilities.water = e.target.checked; });
          utilGas?.addEventListener('change', (e) => { md.utilities.gas = e.target.checked; });

          document.querySelectorAll('[data-modal-status]').forEach((btn) => {
            btn.addEventListener('click', () => {
              md.status = btn.getAttribute('data-modal-status');
              renderModal();
            });
          });

          document.querySelectorAll('[data-modal-sharing]').forEach((btn) => {
            btn.addEventListener('click', () => {
              md.sharing = btn.getAttribute('data-modal-sharing');
              renderModal();
            });
          });

          document.querySelectorAll('[data-modal-roomtype]').forEach((btn) => {
            btn.addEventListener('click', () => {
              md.roomType = btn.getAttribute('data-modal-roomtype');
              renderModal();
            });
          });

          // Room Tenants Management Handlers (Landlord Only)
          if (!Array.isArray(md.tenants)) md.tenants = [];
          document.getElementById('toggle-add-tenant-btn')?.addEventListener('click', () => {
            state.landlord.showAddTenantForm = true;
            state.landlord.newTenantDraft = {
              name: '',
              phone: '',
              email: '',
              moveInDate: new Date().toISOString().slice(0, 10),
              idNote: '',
              rentStatus: 'paid',
            };
            renderModal();
          });

          document.getElementById('cancel-add-tenant-btn')?.addEventListener('click', () => {
            state.landlord.showAddTenantForm = false;
            renderModal();
          });

          document.querySelectorAll('[data-new-tenant-field]').forEach((input) => {
            const evtName = input.tagName === 'SELECT' ? 'change' : 'input';
            input.addEventListener(evtName, (e) => {
              const field = input.getAttribute('data-new-tenant-field');
              if (!state.landlord.newTenantDraft) {
                state.landlord.newTenantDraft = {
                  name: '',
                  phone: '',
                  email: '',
                  moveInDate: new Date().toISOString().slice(0, 10),
                  idNote: '',
                  rentStatus: 'paid',
                };
              }
              state.landlord.newTenantDraft[field] = e.target.value;
            });
          });

          document.getElementById('confirm-add-tenant-btn')?.addEventListener('click', () => {
            const nt = state.landlord.newTenantDraft || {};
            const errEl = document.getElementById('add-tenant-error');
            const trimmedName = String(nt.name || '').trim();
            const trimmedPhone = String(nt.phone || '').trim();
            const trimmedEmail = String(nt.email || '').trim();

            if (!trimmedName) {
              if (errEl) { errEl.textContent = 'Tenant full name is required.'; errEl.classList.remove('hidden'); }
              return;
            }
            if (!isValidPhone(trimmedPhone)) {
              if (errEl) { errEl.textContent = 'Please enter a valid 10-digit tenant phone number.'; errEl.classList.remove('hidden'); }
              return;
            }
            if (trimmedEmail && !isValidEmail(trimmedEmail)) {
              if (errEl) { errEl.textContent = 'Please enter a valid email address or leave it blank.'; errEl.classList.remove('hidden'); }
              return;
            }

            md.tenants.push({
              id: `ten-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
              name: trimmedName,
              phone: trimmedPhone,
              email: trimmedEmail,
              moveInDate: String(nt.moveInDate || '').trim(),
              idNote: String(nt.idNote || '').trim(),
              rentStatus: nt.rentStatus === 'pending' ? 'pending' : 'paid',
            });
            if (md.status === 'available') {
              md.status = 'occupied';
            }
            state.landlord.showAddTenantForm = false;
            state.landlord.newTenantDraft = null;
            renderModal();
          });

          document.querySelectorAll('[data-toggle-tenant-rent]').forEach((btn) => {
            btn.addEventListener('click', () => {
              const idx = Number(btn.getAttribute('data-toggle-tenant-rent'));
              const ten = md.tenants[idx];
              if (ten) {
                ten.rentStatus = ten.rentStatus === 'pending' ? 'paid' : 'pending';
                renderModal();
              }
            });
          });

          document.querySelectorAll('[data-remove-room-tenant]').forEach((btn) => {
            btn.addEventListener('click', () => {
              const idx = Number(btn.getAttribute('data-remove-room-tenant'));
              md.tenants.splice(idx, 1);
              renderModal();
            });
          });

          const fileInput = document.getElementById('room-images-file-input');
          document.getElementById('upload-photos-btn')?.addEventListener('click', () => fileInput?.click());
          document.getElementById('upload-empty-trigger')?.addEventListener('click', () => fileInput?.click());

          fileInput?.addEventListener('change', async (e) => {
            const files = Array.from(e.target.files || []).filter((f) => f.type.startsWith('image/'));
            if (files.length === 0) return;
            const remaining = Math.max(0, 6 - md.images.length);
            const batch = files.slice(0, remaining);
            try {
              const encoded = await Promise.all(batch.map((file) => readAndOptimizeImage(file)));
              md.images.push(...encoded);
              renderModal();
            } catch {
              showToast('Upload failed', 'Could not read the selected image files.', 'error');
            }
          });

          document.querySelectorAll('[data-remove-modal-img]').forEach((btn) => {
            btn.addEventListener('click', () => {
              const idx = Number(btn.getAttribute('data-remove-modal-img'));
              md.images.splice(idx, 1);
              renderModal();
            });
          });

          document.getElementById('room-editor-form')?.addEventListener('submit', (e) => {
            e.preventDefault();
            const errEl = document.getElementById('room-editor-error');
            const trimmedLabel = String(md.label || '').trim();
            const parsedRent = Number(md.rent);
            if (!trimmedLabel) {
              if (errEl) { errEl.textContent = 'Room number or label is required.'; errEl.classList.remove('hidden'); }
              return;
            }
            if (!Number.isFinite(parsedRent) || parsedRent <= 0) {
              if (errEl) { errEl.textContent = 'Please enter a valid monthly rent greater than 0.'; errEl.classList.remove('hidden'); }
              return;
            }

            const { floorId, roomId } = state.landlord.editingRoomRef;
            const floor = state.landlord.draft.floors.find((f) => f.id === floorId);
            if (floor) {
              floor.rooms = floor.rooms.map((rm) =>
                rm.id === roomId
                  ? {
                      ...rm,
                      label: trimmedLabel,
                      rent: Math.round(parsedRent),
                      status: md.status,
                      sharing: SHARING_OPTIONS.includes(md.sharing) ? md.sharing : 'Single',
                      roomType: ROOM_TYPE_OPTIONS.includes(md.roomType) ? md.roomType : 'AC',
                      utilities: { ...md.utilities },
                      images: [...md.images],
                      tenants: deepClone(Array.isArray(md.tenants) ? md.tenants : []),
                      maintenanceNotes: String(md.maintenanceNotes || '').trim(),
                    }
                  : rm
              );
            }
            state.landlord.isDirty = true;
            state.landlord.editingRoomRef = null;
            state.landlord.modalDraft = null;
            state.landlord.showAddTenantForm = false;
            state.landlord.newTenantDraft = null;
            render();
            const unitWord = getPropertyType(state.landlord.draft) === 'flat' ? 'Flat' : 'Room';
            showToast(
              `${unitWord} ${trimmedLabel} updated`,
              'Click "Save Property" to publish changes to the Student / Tenant portal.',
              'info'
            );
          });
        }

        function bindRoomDetailModalEvents(property, room) {
          const backdrop = document.getElementById('modal-backdrop');

            backdrop.addEventListener('click', (e) => {

            });
          }
          document.querySelectorAll('[data-close-modal]').forEach((btn) => {
            btn.addEventListener('click', closeModals);
          });

          const totalImgs = (room.images || []).length;
          document.getElementById('gallery-prev-btn')?.addEventListener('click', () => {
            state.tenant.activeImageIdx = (state.tenant.activeImageIdx - 1 + totalImgs) % totalImgs;
            renderModal();
          });
          document.getElementById('gallery-next-btn')?.addEventListener('click', () => {
            state.tenant.activeImageIdx = (state.tenant.activeImageIdx + 1) % totalImgs;
            renderModal();
          });
          document.querySelectorAll('[data-gallery-idx]').forEach((btn) => {
            btn.addEventListener('click', () => {
              state.tenant.activeImageIdx = Number(btn.getAttribute('data-gallery-idx'));
              renderModal();
            });
          });

          document.getElementById('show-contact-btn')?.addEventListener('click', () => {
            state.tenant.showContactPanel = true;
            renderModal();
          });

          document.getElementById('copy-owner-phone-btn')?.addEventListener('click', async () => {
            try {
              await navigator.clipboard.writeText(property.owner.phone);
              state.tenant.copiedPhone = true;
              renderModal();
              window.setTimeout(() => {
                state.tenant.copiedPhone = false;
                renderModal();
              }, 1800);
            } catch {}
          });

          document.querySelectorAll('[data-confirm-visit]').forEach((btn) => {
            btn.addEventListener('click', () => {
              const already = state.visitRequests.some(
                (vr) => vr.propertyId === property.id && vr.roomId === room.id
              );
              if (!already) {
                state.visitRequests.unshift({
                  id: `vr-${Date.now()}`,
                  propertyId: property.id,
                  propertyName: property.name,
                  roomId: room.id,
                  roomLabel: room.label,
                  tenantName: state.tenantProfile?.fullName || 'Prospective Tenant',
                  tenantPhone: state.tenantProfile?.phone || '',
                  tenantEmail: state.tenantProfile?.email || '',
                  createdAt: new Date().toISOString(),
                });
                saveVisitRequests(state.visitRequests);
                const unitLabel = getPropertyType(property) === 'flat' ? 'Flat' : 'Room';
                showToast(
                  'Visit request sent',
                  `${property.owner.name} has been notified about ${unitLabel} ${room.label} at ${property.name}.`,
                  'success'
                );
              }
              state.tenant.showContactPanel = true;
              render();
            });
          });

          // Quick jump from Room Detail Modal to Maintenance Complaint Letter pre-filled for this room
          document.getElementById('open-room-complaint-btn')?.addEventListener('click', () => {
            state.tenant.complaintForm.propertyId = property.id;
            state.tenant.complaintForm.roomLabel = room.label;
            closeModals();
            render();
            window.setTimeout(() => {
              document.getElementById('tenant-complaint-section')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 60);
          });

          // Room Review Box interactions
          document.querySelectorAll('[data-pick-review-star]').forEach((btn) => {
            btn.addEventListener('click', () => {
              state.tenant.reviewDraft.rating = Number(btn.getAttribute('data-pick-review-star')) || 5;
              renderModal();
            });
          });

          document.getElementById('room-review-name')?.addEventListener('input', (e) => {
            state.tenant.reviewDraft.reviewerName = e.target.value;
          });
          document.getElementById('room-review-staytype')?.addEventListener('change', (e) => {
            state.tenant.reviewDraft.stayType = e.target.value;
          });
          document.getElementById('room-review-comment')?.addEventListener('input', (e) => {
            state.tenant.reviewDraft.comment = e.target.value;
          });

          document.getElementById('submit-room-review-btn')?.addEventListener('click', () => {
            const nameInput = document.getElementById('room-review-name');
            const commentInput = document.getElementById('room-review-comment');
            const staySelect = document.getElementById('room-review-staytype');
            const reviewerName = (nameInput?.value || state.tenant.reviewDraft.reviewerName || '').trim();
            const comment = (commentInput?.value || state.tenant.reviewDraft.comment || '').trim();
            const stayType = staySelect?.value || state.tenant.reviewDraft.stayType || 'Current Tenant';
            const rating = Math.min(5, Math.max(1, Number(state.tenant.reviewDraft.rating) || 5));

            if (!reviewerName) {
              state.tenant.reviewDraft.error = 'Please enter your name before posting a review.';
              renderModal();
              return;
            }
            if (comment.length < 6) {
              state.tenant.reviewDraft.error = 'Please write at least a short sentence about this room.';
              renderModal();
              return;
            }

            const newReview = {
              id: `rev-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
              propertyId: property.id,
              roomId: room.id,
              roomLabel: room.label,
              reviewerName,
              stayType,
              rating,
              comment,
              createdAt: new Date().toISOString(),
            };
            state.reviews.unshift(newReview);
            saveReviews(state.reviews);
            state.tenant.reviewDraft = {
              rating: 5,
              reviewerName: state.tenantProfile?.fullName || reviewerName,
              stayType: 'Current Tenant',
              comment: '',
              error: '',
            };
            render();
            showToast('Room review posted', `Your ${rating}-star review for ${room.label} is now live.`, 'success');
          });
        }

        function closeModals() {
          state.landlord.editingRoomRef = null;
          state.landlord.modalDraft = null;
          state.tenant.selectedRoomCtx = null;
          state.tenant.showContactPanel = false;
          state.tenant.copiedPhone = false;
          state.auth.profileModalOpen = false;
          state.auth.profileError = '';
          renderModal();
        }

        function bindMainEvents() {
          const main = document.getElementById('main-content');

          // --- AUTHENTICATION GATE EVENTS ---
          if (!state.auth.user || !authToken) {
            bindAuthGateEvents(main);
            return;
          }

          // --- LANDING EVENTS ---
          if (state.role === 'landing') {
            main.querySelectorAll('[data-pick-role]').forEach((el) => {
              el.addEventListener('click', (e) => {
                e.stopPropagation();
                setRole(el.getAttribute('data-pick-role'));
              });
              el.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                  e.preventDefault();
                  setRole(el.getAttribute('data-pick-role'));
                }
              });
            });

            main.querySelectorAll('[data-launch-tenant-cat]').forEach((btn) => {
              btn.addEventListener('click', () => {
                const cat = btn.getAttribute('data-launch-tenant-cat') === 'flat' ? 'flat' : 'hostel';
                state.tenant.activeCategory = cat;
                state.tenant.formValues.preferredCategory = cat;
                if (state.tenantProfile) {
                  state.tenantProfile = { ...state.tenantProfile, preferredCategory: cat };
                  saveTenantProfile(state.tenantProfile);
                }
                setRole('tenant');
              });
            });

            // Quick Search Auto Location (Landing Overview)
            const runLandingAutoLocation = async () => {
              const btn = document.getElementById('landing-auto-loc-btn');
              const span = btn?.querySelector('span');
              const orig = span ? span.textContent : 'Auto Location';
              if (btn) btn.disabled = true;
              if (span) span.textContent = 'Locating...';
              try {
                const res = await StayGridMaps.detectAutoLocation();
                state.landingAutoLocation = res;
                render();
                showToast('Auto Location detected', `${res.locationLabel} selected in Quick Search.`, 'success');
              } catch (err) {
                const sel = document.getElementById('landing-loc-select');
                if (sel && sel.value === '__auto__') sel.value = '';
                showToast('Auto Location unavailable', err?.message || 'Could not detect your location.', 'error');
              } finally {
                if (btn) btn.disabled = false;
                if (span) span.textContent = orig;
              }
            };

            document.getElementById('landing-auto-loc-btn')?.addEventListener('click', () => {
              void runLandingAutoLocation();
            });

            document.getElementById('landing-loc-select')?.addEventListener('change', (e) => {
              if (e.target.value === '__auto__') {
                void runLandingAutoLocation();
              } else if (e.target.value !== state.landingAutoLocation?.locationLabel) {
                state.landingAutoLocation = null;
              }
            });

            // Quick Search Form on Landing Page
            document.getElementById('landing-quick-search-form')?.addEventListener('submit', async (e) => {
              e.preventDefault();
              let loc = document.getElementById('landing-loc-select')?.value || '';
              if (loc === '__auto__') {
                await runLandingAutoLocation();
                loc = state.landingAutoLocation?.locationLabel || '';
              }
              const cat = document.getElementById('landing-type-select')?.value === 'flat' ? 'flat' : 'hostel';
              const price = document.getElementById('landing-price-select')?.value || 'all';
              const autoCoords =
                state.landingAutoLocation && loc === state.landingAutoLocation.locationLabel
                  ? state.landingAutoLocation.coords
                  : null;
              const autoAddr =
                state.landingAutoLocation && loc === state.landingAutoLocation.locationLabel
                  ? state.landingAutoLocation.formattedAddress
                  : '';

              state.tenant.activeCategory = cat;
              state.tenant.formValues.preferredCategory = cat;
              state.tenant.filters.priceRange = price;
              state.tenant.hostelQuery = '';
              state.tenant.expandedPropertyId = null;

              state.tenant.formValues.preferredLocation = loc;
              state.tenant.formValues.preferredCoords = autoCoords;
              state.tenant.formValues.preferredFormattedAddress = autoAddr;
              if (state.tenantProfile) {
                state.tenantProfile = {
                  ...state.tenantProfile,
                  preferredCategory: cat,
                  preferredLocation: loc,
                  preferredCoords: autoCoords,
                  preferredFormattedAddress: autoAddr,
                };
                saveTenantProfile(state.tenantProfile);
                state.tenant.isEditingProfile = false;
              } else {
                const u = state.auth.user;
                state.tenantProfile = {
                  fullName: u?.profile?.fullName || 'Student',
                  phone: u?.profile?.phone || '',
                  email: u?.email || '',
                  preferredLocation: loc,
                  preferredCoords: autoCoords,
                  preferredFormattedAddress: autoAddr,
                  preferredCategory: cat,
                };
                state.tenant.formValues = { ...state.tenantProfile };
                state.tenant.isEditingProfile = false;
              }
              setRole('tenant');
            });

            // Click any Popular Property card to jump straight to its 2D Floor Plan
            main.querySelectorAll('[data-open-featured-prop]').forEach((card) => {
              const openProp = () => {
                const propId = card.getAttribute('data-open-featured-prop');
                const prop = state.properties.find((p) => p.id === propId);
                if (!prop) return;
                const cat = getPropertyType(prop);
                state.tenant.activeCategory = cat;
                state.tenant.formValues.preferredCategory = cat;
                state.tenant.formValues.preferredLocation = prop.location;
                state.tenant.filters.priceRange = 'all';
                state.tenant.filters.utilities = { electricity: false, water: false, gas: false };
                state.tenant.filters.genders = [];
                state.tenant.filters.sharings = [];
                state.tenant.filters.roomTypes = [];
                state.tenant.filters.amenities = { food: false, wifi: false, laundry: false, parking: false, powerBackup: false };
                state.tenant.hostelQuery = '';
                state.tenant.expandedPropertyId = prop.id;
                if (state.tenantProfile) {
                  state.tenantProfile = {
                    ...state.tenantProfile,
                    preferredCategory: cat,
                    preferredLocation: prop.location,
                  };
                  saveTenantProfile(state.tenantProfile);
                } else {
                  state.tenantProfile = {
                    fullName: 'Guest Student',
                    phone: '+91 90000 00000',
                    email: 'student@staygrid.in',
                    preferredLocation: prop.location,
                    preferredCategory: cat,
                  };
                  state.tenant.formValues = { ...state.tenantProfile };
                }
                state.tenant.isEditingProfile = false;
                setRole('tenant');
              };
              card.addEventListener('click', openProp);
              card.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                  e.preventDefault();
                  openProp();
                }
              });
            });
            return;
          }

          // --- LANDLORD EVENTS ---
          if (state.role === 'landlord') {
            const selectProp = (id, forcedCategory) => {
              const cat = forcedCategory || state.landlord.activeCategory;
              if (id === 'new') {
                state.landlord.selectedPropertyId = 'new';
                state.landlord.draft = createEmptyProperty(cat);
              } else {
                const found = state.properties.find((p) => p.id === id);
                if (!found) return;
                state.landlord.activeCategory = getPropertyType(found);
                state.landlord.selectedPropertyId = found.id;
                state.landlord.draft = deepClone(found);
              }
              syncRoomCountInputsFromDraft();
              state.landlord.formErrors = {};
              state.landlord.isDirty = false;
              render();
            };

            main.querySelectorAll('[data-landlord-category]').forEach((btn) => {
              btn.addEventListener('click', () => {
                const nextCat = btn.getAttribute('data-landlord-category');
                if (nextCat === state.landlord.activeCategory) return;
                state.landlord.activeCategory = nextCat;
                const firstInCat = state.properties.find((p) => getPropertyType(p) === nextCat);
                if (firstInCat) {
                  selectProp(firstInCat.id, nextCat);
                } else {
                  selectProp('new', nextCat);
                }
              });
            });

            main.querySelectorAll('[data-draft-property-type]').forEach((btn) => {
              btn.addEventListener('click', () => {
                const nextType = btn.getAttribute('data-draft-property-type');
                state.landlord.draft.propertyType = nextType;
                state.landlord.activeCategory = nextType;
                state.landlord.isDirty = true;
                render();
              });
            });

            main.querySelectorAll('[data-draft-gender]').forEach((btn) => {
              btn.addEventListener('click', () => {
                state.landlord.draft.gender = btn.getAttribute('data-draft-gender');
                state.landlord.isDirty = true;
                render();
              });
            });

            main.querySelectorAll('[data-draft-amenity]').forEach((btn) => {
              btn.addEventListener('click', () => {
                const key = btn.getAttribute('data-draft-amenity');
                if (!state.landlord.draft.amenities) {
                  state.landlord.draft.amenities = { food: false, wifi: false, laundry: false, parking: false, powerBackup: false };
                }
                state.landlord.draft.amenities[key] = !state.landlord.draft.amenities[key];
                state.landlord.isDirty = true;
                render();
              });
            });

            document.getElementById('property-selector')?.addEventListener('change', (e) => selectProp(e.target.value));
            document.getElementById('new-property-btn')?.addEventListener('click', () => selectProp('new', state.landlord.activeCategory));

            main.querySelectorAll('[data-landlord-field]').forEach((input) => {
              input.addEventListener('input', (e) => {
                const field = input.getAttribute('data-landlord-field');
                const val = e.target.value;
                if (field === 'owner_name') state.landlord.draft.owner.name = val;
                else if (field === 'owner_phone') state.landlord.draft.owner.phone = val;
                else if (field === 'owner_email') state.landlord.draft.owner.email = val;
                else if (field === 'name') {
                  state.landlord.draft.name = val;
                  const h1 = document.getElementById('landlord-heading-title');
                  if (h1) h1.textContent = val.trim() || (state.landlord.activeCategory === 'flat' ? 'New Flat / Local House Listing' : 'New College Hostel Listing');
                } else if (field === 'location') {
                  state.landlord.draft.location = val;
                  const locSpan = document.getElementById('publish-location-preview');
                  if (locSpan) locSpan.textContent = val.trim() || 'your location';
                }
                delete state.landlord.formErrors[field];
                state.landlord.isDirty = true;
                document.getElementById('unsaved-indicator')?.classList.remove('hidden');
              });
            });

            const addFloor = () => {
              const pType = getPropertyType(state.landlord.draft);
              const idx = state.landlord.draft.floors.length;
              const flId = `fl-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`;
              const defaultCount = pType === 'flat' ? 2 : 4;
              const defaultRent = pType === 'flat' ? 14500 : 9500;
              const rooms = Array.from({ length: defaultCount }, (_, rIdx) => ({
                id: `rm-${Date.now()}-${rIdx}-${Math.random().toString(36).slice(2, 5)}`,
                label: generateRoomLabel(idx, rIdx, pType),
                rent: defaultRent,
                status: 'available',
                sharing: SHARING_OPTIONS[rIdx % 3],
                roomType: rIdx % 2 === 0 ? 'AC' : 'Non-AC',
                utilities: { electricity: false, water: true, gas: pType !== 'flat' },
                images: [],
                maintenanceNotes: '',
              }));
              state.landlord.draft.floors.push({ id: flId, name: createDefaultFloorName(idx), rooms });
              state.landlord.roomCountInputs[flId] = String(defaultCount);
              state.landlord.isDirty = true;
              render();
            };

            document.getElementById('add-floor-btn')?.addEventListener('click', addFloor);
            document.getElementById('add-first-floor-btn')?.addEventListener('click', addFloor);

            main.querySelectorAll('[data-floor-name-input]').forEach((input) => {
              input.addEventListener('input', (e) => {
                const flId = input.getAttribute('data-floor-name-input');
                const fl = state.landlord.draft.floors.find((f) => f.id === flId);
                if (fl) fl.name = e.target.value;
                state.landlord.isDirty = true;
                document.getElementById('unsaved-indicator')?.classList.remove('hidden');
              });
            });

            main.querySelectorAll('[data-room-count-input]').forEach((input) => {
              input.addEventListener('input', (e) => {
                const flId = input.getAttribute('data-room-count-input');
                state.landlord.roomCountInputs[flId] = e.target.value;
              });
            });

            main.querySelectorAll('[data-generate-rooms]').forEach((btn) => {
              btn.addEventListener('click', () => {
                const [flId, flIdxStr] = btn.getAttribute('data-generate-rooms').split('::');
                const flIdx = Number(flIdxStr);
                const rawCount = Number(state.landlord.roomCountInputs[flId]);
                if (!Number.isInteger(rawCount) || rawCount < 1 || rawCount > 30) {
                  showToast('Enter between 1 and 30 rooms', 'Choose a valid room count before updating the grid.', 'error');
                  return;
                }
                const fl = state.landlord.draft.floors.find((f) => f.id === flId);
                if (!fl) return;
                if (rawCount < fl.rooms.length) {
                  fl.rooms = fl.rooms.slice(0, rawCount);
                } else if (rawCount > fl.rooms.length) {
                  const pType = getPropertyType(state.landlord.draft);
                  const baseRent = fl.rooms[0]?.rent ?? (pType === 'flat' ? 14500 : 9500);
                  for (let i = fl.rooms.length; i < rawCount; i += 1) {
                    fl.rooms.push({
                      id: `rm-${Date.now()}-${i}-${Math.random().toString(36).slice(2, 6)}`,
                      label: generateRoomLabel(flIdx, i, pType),
                      rent: baseRent,
                      status: 'available',
                      sharing: SHARING_OPTIONS[i % 3],
                      roomType: i % 2 === 0 ? 'AC' : 'Non-AC',
                      utilities: { electricity: false, water: true, gas: pType !== 'flat' },
                      images: [],
                      maintenanceNotes: '',
                    });
                  }
                }
                state.landlord.isDirty = true;
                render();
              });
            });

            main.querySelectorAll('[data-remove-floor]').forEach((btn) => {
              btn.addEventListener('click', () => {
                const flId = btn.getAttribute('data-remove-floor');
                state.landlord.draft.floors = state.landlord.draft.floors.filter((f) => f.id !== flId);
                state.landlord.isDirty = true;
                render();
              });
            });

            main.querySelectorAll('[data-quick-toggle]').forEach((btn) => {
              btn.addEventListener('click', (e) => {
                e.stopPropagation();
                const [flId, rmId] = btn.getAttribute('data-quick-toggle').split('::');
                const fl = state.landlord.draft.floors.find((f) => f.id === flId);
                const rm = fl?.rooms.find((r) => r.id === rmId);
                if (rm) {
                  rm.status = rm.status === 'available' ? 'occupied' : 'available';
                  state.landlord.isDirty = true;
                  render();
                }
              });
            });

            main.querySelectorAll('[data-open-room-editor]').forEach((card) => {
              const openEditor = (evt) => {
                const [floorId, roomId] = card.getAttribute('data-open-room-editor').split('::');
                const fl = state.landlord.draft.floors.find((f) => f.id === floorId);
                const rm = fl?.rooms.find((r) => r.id === roomId);
                if (!rm) return;
                triggerRoomClickAnimation(card, evt, () => {
                  state.landlord.editingRoomRef = { floorId, roomId };
                  state.landlord.modalDraft = deepClone(rm);
                  if (!Array.isArray(state.landlord.modalDraft.tenants)) {
                    state.landlord.modalDraft.tenants = [];
                  }
                  state.landlord.showAddTenantForm = false;
                  state.landlord.newTenantDraft = null;
                  renderModal();
                });
              };
              card.addEventListener('click', openEditor);
              card.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                  e.preventDefault();
                  openEditor(e);
                }
              });
            });

            main.querySelectorAll('[data-save-property-btn]').forEach((btn) => {
              btn.addEventListener('click', () => {
                const d = state.landlord.draft;
                const errors = {};
                if (!d.owner.name.trim()) errors.owner_name = 'Owner name is required.';
                if (!isValidPhone(d.owner.phone)) errors.owner_phone = 'Enter a valid 10-digit phone number.';
                if (!isValidEmail(d.owner.email)) errors.owner_email = 'Enter a valid email address.';
                if (!d.name.trim()) errors.name = getPropertyType(d) === 'flat' ? 'House or flat building name is required.' : 'College hostel or PG name is required.';
                if (!d.location.trim()) errors.location = 'Location is required.';

                if (Object.keys(errors).length > 0) {
                  state.landlord.formErrors = errors;
                  render();
                  showToast('Please complete required details', 'Check highlighted owner and property fields before saving.', 'error');
                  return;
                }

                const stats = getPropertyStats(d);
                if (d.floors.length === 0 || stats.totalRooms === 0) {
                  showToast('Add at least one floor and room', 'Your property needs at least one room in the 2D grid before publishing.', 'error');
                  return;
                }

                const cleanProp = {
                  ...deepClone(d),
                  propertyType: getPropertyType(d),
                  name: d.name.trim(),
                  location: d.location.trim(),
                  owner: {
                    name: d.owner.name.trim(),
                    phone: d.owner.phone.trim(),
                    email: d.owner.email.trim(),
                  },
                  floors: d.floors.map((fl, i) => ({
                    ...deepClone(fl),
                    name: fl.name.trim() || createDefaultFloorName(i),
                  })),
                  updatedAt: new Date().toISOString(),
                };

                const current = loadProperties();
                const exists = current.some((p) => p.id === cleanProp.id);
                const nextList = exists
                  ? current.map((p) => (p.id === cleanProp.id ? cleanProp : p))
                  : [cleanProp, ...current];

                if (saveProperties(nextList)) {
                  state.properties = nextList;
                  state.landlord.activeCategory = cleanProp.propertyType;
                  state.landlord.selectedPropertyId = cleanProp.id;
                  state.landlord.draft = deepClone(cleanProp);
                  state.landlord.formErrors = {};
                  state.landlord.isDirty = false;
                  syncRoomCountInputsFromDraft();
                  render();
                  showToast(
                    'Property saved & published',
                    `${cleanProp.name} is now live under ${getPropertyTypeLabel(cleanProp.propertyType)} in ${cleanProp.location}.`,
                    'success'
                  );
                } else {
                  showToast('Storage limit reached', 'Try removing a few large photos and save again.', 'error');
                }
              });
            });

            // Landlord Location Tab: Auto Location (GPS) & Google Maps Property Deployer Toggle
            document.getElementById('landlord-auto-loc-btn')?.addEventListener('click', async (ev) => {
              const btn = ev.currentTarget;
              const span = btn.querySelector('span');
              const orig = span ? span.textContent : 'Auto Location';
              btn.disabled = true;
              if (span) span.textContent = 'Locating...';
              try {
                const { locationLabel, formattedAddress, coords, placeId } = await StayGridMaps.detectAutoLocation();
                state.landlord.draft.location = locationLabel;
                state.landlord.draft.formattedAddress = formattedAddress;
                state.landlord.draft.coords = coords;
                state.landlord.draft.placeId = placeId;
                delete state.landlord.formErrors.location;
                state.landlord.isDirty = true;

                const locInput = document.getElementById('property-location');
                if (locInput) locInput.value = locationLabel;
                const locPreview = document.getElementById('publish-location-preview');
                if (locPreview) locPreview.textContent = locationLabel;
                const badge = document.getElementById('landlord-loc-coords-badge');
                if (badge) badge.textContent = `Deployed: ${formatCoordsShort(coords)}`;
                const gLink = document.getElementById('landlord-loc-gmaps-link');
                if (gLink) {
                  gLink.href = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(`${coords.lat},${coords.lng}`)}`;
                }
                document.getElementById('unsaved-indicator')?.classList.remove('hidden');
                StayGridMaps.updatePickerPosition('landlord-location-picker-map', coords, formattedAddress);

              const initCoords = getPropertyCoords(state.landlord.draft);

                searchInputId: 'landlord-loc-map-search',
                suggestionsId: 'landlord-loc-map-suggestions',
                gpsBtnId: 'landlord-loc-gps-btn',
                statusElId: 'landlord-loc-picker-status',

                pinLabel: state.landlord.draft.name || 'Your PG / Hostel',

                  state.landlord.draft.coords = coords;

                  state.tenant.formValues.preferredCoords = c;

              document.getElementById('tenant-onboarding-auto-loc-btn')?.addEventListener('click', async (ev) => {

                  showToast('Auto Location detected', `Preferred area set to ${locationLabel}.`, 'success');
                } catch (err) {
                  showToast('Auto Location unavailable', err?.message || 'Could not detect your GPS location.', 'error');
                } finally {
                  btn.disabled = false;
                  if (span) span.textContent = orig;
                }
              });

              document.getElementById('toggle-tenant-onboarding-map-btn')?.addEventListener('click', () => {
                state.tenant.showOnboardingMapPicker = !state.tenant.showOnboardingMapPicker;

              if (state.tenant.showOnboardingMapPicker) {
                const startCenter = isValidCoords(state.tenant.formValues.preferredCoords)
                  ? state.tenant.formValues.preferredCoords
                  : getCoordsForLocation(state.tenant.formValues.preferredLocation || 'Koramangala, Bengaluru');
                void StayGridMaps.mountLocationPicker({
                  containerId: 'tenant-onboarding-picker-map',
                  searchInputId: 'tenant-onboarding-map-search',
                  suggestionsId: 'tenant-onboarding-map-suggestions',
                  gpsBtnId: 'tenant-onboarding-gps-btn',
                  statusElId: 'tenant-onboarding-picker-status',
                  initialCenter: startCenter,
                  pinLabel: 'My Preferred Area',
                  onLocationPicked: ({ locationLabel, formattedAddress, coords }) => {
                    state.tenant.formValues.preferredLocation = locationLabel;
                    state.tenant.formValues.preferredCoords = coords;
                    state.tenant.formValues.preferredFormattedAddress = formattedAddress;
                    delete state.tenant.formErrors.preferredLocation;

                    const locInput = document.getElementById('tenant-location');
                    if (locInput) locInput.value = locationLabel;
                    const badge = document.getElementById('tenant-onboarding-coords-badge');
                    if (badge) badge.textContent = `Pinned: ${formatCoordsShort(coords)}`;
                  },
                });

              document.getElementById('cancel-tenant-edit-btn')?.addEventListener('click', () => {
                state.tenant.isEditingProfile = false;
                render();
              });

              form?.addEventListener('submit', (e) => {
                e.preventDefault();
                const fv = state.tenant.formValues;

                if (!isValidPhone(fv.phone)) errors.phone = 'Enter a valid 10-digit phone number.';
                if (!isValidEmail(fv.email)) errors.email = 'Enter a valid email address.';
                if (!fv.preferredLocation.trim()) errors.preferredLocation = 'Please enter or select your preferred location.';

                if (Object.keys(errors).length > 0) {
                  state.tenant.formErrors = errors;

                const chosenCategory = fv.preferredCategory === 'flat' ? 'flat' : 'hostel';
                const nextProfile = {
                  fullName: fv.fullName.trim(),
                  phone: fv.phone.trim(),
                  email: fv.email.trim(),
                  preferredLocation: fv.preferredLocation.trim(),
                  preferredCoords: isValidCoords(fv.preferredCoords) ? fv.preferredCoords : null,
                  preferredFormattedAddress: String(fv.preferredFormattedAddress || '').trim(),
                  preferredCategory: chosenCategory,
                };
                state.tenantProfile = nextProfile;
                saveTenantProfile(nextProfile);
                state.tenant.activeCategory = chosenCategory;
                state.tenant.formValues = { ...nextProfile };
                state.tenant.formErrors = {};
                state.tenant.isEditingProfile = false;
                state.tenant.hostelQuery = '';
                state.tenant.expandedPropertyId = null;
                render();
                showToast(
                  'Preferences updated',
                  `Showing ${getPropertyTypeLabel(chosenCategory)} near ${nextProfile.preferredLocation}.`,
                  'info'

            main.querySelectorAll('[data-tenant-category]').forEach((btn) => {
              btn.addEventListener('click', () => {

                state.tenant.activeCategory = nextCat;
                state.tenant.hostelQuery = '';
                state.tenant.isDropdownOpen = false;
                state.tenant.expandedPropertyId = null;
                if (state.tenantProfile) {
                  state.tenantProfile = { ...state.tenantProfile, preferredCategory: nextCat };

                  saveTenantProfile(state.tenantProfile);
                }
                render();
              });
            });

            document.getElementById('edit-tenant-profile-btn')?.addEventListener('click', () => {
              state.tenant.isEditingProfile = true;
              render();
            });

            // One-tap Auto Location in Student Browse Bar
            document.getElementById('tenant-browse-auto-loc-btn')?.addEventListener('click', async (ev) => {
              const btn = ev.currentTarget;
              const span = btn.querySelector('span');
              const orig = span ? span.textContent : 'Auto Location';
              btn.disabled = true;
              if (span) span.textContent = 'Locating...';
              try {
                const { locationLabel, formattedAddress, coords } = await StayGridMaps.detectAutoLocation();
                const updatedProfile = {
                  ...(state.tenantProfile || {}),
                  preferredLocation: locationLabel,
                  preferredCoords: coords,
                  preferredFormattedAddress: formattedAddress,
                  preferredCategory: state.tenant.activeCategory,
                };
                state.tenantProfile = updatedProfile;
                saveTenantProfile(updatedProfile);
                state.tenant.formValues.preferredLocation = locationLabel;
                state.tenant.formValues.preferredCoords = coords;
                state.tenant.formValues.preferredFormattedAddress = formattedAddress;
                state.tenant.hostelQuery = '';
                state.tenant.expandedPropertyId = null;
                render();
                showToast('Auto Location applied', `Showing stays nearest to ${locationLabel}.`, 'success');
              } catch (err) {
                showToast('Auto Location unavailable', err?.message || 'Could not detect your GPS location.', 'error');
