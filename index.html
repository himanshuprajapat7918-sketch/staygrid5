                btn.disabled = false;
                if (span) span.textContent = orig;
              }
            });

            // Quick Inline Google Maps Preferred Location Drawer (Tenant Browse View)
            document.getElementById('toggle-tenant-quick-map-btn')?.addEventListener('click', () => {
              state.tenant.showQuickLocationMapPicker = !state.tenant.showQuickLocationMapPicker;
              if (state.tenant.showQuickLocationMapPicker) {
                const curLoc = (state.tenantProfile?.preferredLocation || state.tenant.formValues.preferredLocation || '').trim();
                const curCoords = isValidCoords(state.tenantProfile?.preferredCoords)
                  ? state.tenantProfile.preferredCoords
                  : getCoordsForLocation(curLoc);
                state.tenant.quickMapDraft = {
                  locationLabel: curLoc,
                  formattedAddress: state.tenantProfile?.preferredFormattedAddress || curLoc,
                  coords: curCoords,
                  placeId: '',
                };
              }
              render();
            });

            if (state.tenant.showQuickLocationMapPicker) {
              const curLoc = (state.tenantProfile?.preferredLocation || state.tenant.formValues.preferredLocation || '').trim();
              const startCoords = isValidCoords(state.tenant.quickMapDraft?.coords)
                ? state.tenant.quickMapDraft.coords
                : isValidCoords(state.tenantProfile?.preferredCoords)
                ? state.tenantProfile.preferredCoords
                : getCoordsForLocation(curLoc);

              void StayGridMaps.mountLocationPicker({
                containerId: 'tenant-quick-picker-map',
                searchInputId: 'tenant-quick-map-search',
                suggestionsId: 'tenant-quick-map-suggestions',
                gpsBtnId: 'tenant-quick-gps-btn',
                statusElId: 'tenant-quick-picker-status',
                initialCenter: startCoords,
                pinLabel: 'My Preferred Area',
                onLocationPicked: ({ locationLabel, formattedAddress, coords, placeId }) => {
                  state.tenant.quickMapDraft = { locationLabel, formattedAddress, coords, placeId };
                },
              });

              document.getElementById('clear-tenant-location-filter-btn')?.addEventListener('click', () => {
                state.tenant.formValues.preferredLocation = '';
                state.tenant.formValues.preferredCoords = null;
                state.tenant.formValues.preferredFormattedAddress = '';
                if (state.tenantProfile) {
                  state.tenantProfile = {
                    ...state.tenantProfile,
                    preferredLocation: '',
                    preferredCoords: null,
                    preferredFormattedAddress: '',
                  };
                  saveTenantProfile(state.tenantProfile);
                }
                state.tenant.showQuickLocationMapPicker = false;
                state.tenant.quickMapDraft = null;
                render();
                showToast('Showing all locations', 'Viewing all listed hostels and flats across cities.', 'info');
              });

              document.getElementById('apply-tenant-quick-location-btn')?.addEventListener('click', () => {
                const draftLoc = state.tenant.quickMapDraft;
                const typedSearch = document.getElementById('tenant-quick-map-search')?.value?.trim() || '';
                const nextLoc = (draftLoc?.locationLabel || typedSearch || '').trim();
                const nextCoords = isValidCoords(draftLoc?.coords) ? draftLoc.coords : null;
                const nextAddr = (draftLoc?.formattedAddress || nextLoc).trim();

                state.tenant.formValues.preferredLocation = nextLoc;
                state.tenant.formValues.preferredCoords = nextCoords;
                state.tenant.formValues.preferredFormattedAddress = nextAddr;
                if (state.tenantProfile) {
                  state.tenantProfile = {
                    ...state.tenantProfile,
                    preferredLocation: nextLoc,
                    preferredCoords: nextCoords,
                    preferredFormattedAddress: nextAddr,
                  };
                  saveTenantProfile(state.tenantProfile);
                }
                state.tenant.showQuickLocationMapPicker = false;
                state.tenant.quickMapDraft = null;
                state.tenant.expandedPropertyId = null;
                render();
                showToast(
                  'Preferred location updated via Google Maps',
                  nextLoc ? `Now showing stays near ${nextLoc}.` : 'Showing all locations.',
                  'success'
                );
              });
            }

            // Filter Controls: One-Tap Toggle Pill Chips (Gender, Sharing, Room Type, Amenities, Rent, Utilities)
            const resetTenantFilters = () => {
              state.tenant.filters.priceRange = 'all';
              state.tenant.filters.utilities = { electricity: false, water: false, gas: false };
              state.tenant.filters.genders = [];
              state.tenant.filters.sharings = [];
              state.tenant.filters.roomTypes = [];
              state.tenant.filters.amenities = { food: false, wifi: false, laundry: false, parking: false, powerBackup: false };
              render();
            };

            const toggleArrayFilter = (arr, val) => {
              const idx = arr.indexOf(val);
              if (idx >= 0) arr.splice(idx, 1);
              else arr.push(val);
            };

            main.querySelectorAll('[data-filter-gender]').forEach((btn) => {
              btn.addEventListener('click', () => {
                const val = btn.getAttribute('data-filter-gender');
                if (!Array.isArray(state.tenant.filters.genders)) state.tenant.filters.genders = [];
                toggleArrayFilter(state.tenant.filters.genders, val);
                render();
              });
            });

            main.querySelectorAll('[data-filter-sharing]').forEach((btn) => {
              btn.addEventListener('click', () => {
                const val = btn.getAttribute('data-filter-sharing');
                if (!Array.isArray(state.tenant.filters.sharings)) state.tenant.filters.sharings = [];
                toggleArrayFilter(state.tenant.filters.sharings, val);
                render();
              });
            });

            main.querySelectorAll('[data-filter-roomtype]').forEach((btn) => {
              btn.addEventListener('click', () => {
                const val = btn.getAttribute('data-filter-roomtype');
                if (!Array.isArray(state.tenant.filters.roomTypes)) state.tenant.filters.roomTypes = [];
                toggleArrayFilter(state.tenant.filters.roomTypes, val);
                render();
              });
            });

            main.querySelectorAll('[data-filter-amenity]').forEach((btn) => {
              btn.addEventListener('click', () => {
                const key = btn.getAttribute('data-filter-amenity');
                if (!state.tenant.filters.amenities) {
                  state.tenant.filters.amenities = { food: false, wifi: false, laundry: false, parking: false, powerBackup: false };
                }
                state.tenant.filters.amenities[key] = !state.tenant.filters.amenities[key];
                render();
              });
            });

            main.querySelectorAll('[data-filter-price]').forEach((btn) => {
              btn.addEventListener('click', () => {
                const range = btn.getAttribute('data-filter-price');
                state.tenant.filters.priceRange = state.tenant.filters.priceRange === range && range !== 'all' ? 'all' : range;
                render();
              });
            });

            main.querySelectorAll('[data-filter-utility]').forEach((btn) => {
              btn.addEventListener('click', () => {
                const key = btn.getAttribute('data-filter-utility');
                state.tenant.filters.utilities[key] = !state.tenant.filters.utilities[key];
                render();
              });
            });

            document.getElementById('reset-tenant-filters-btn')?.addEventListener('click', resetTenantFilters);

            // Predictive Search Wiring
            const searchInput = document.getElementById('hostel-predictive-search');
            const dropdown = document.getElementById('hostel-predictions-listbox');
            const activeLocation = (state.tenantProfile?.preferredLocation || state.tenant.formValues.preferredLocation || '').trim();

            const selectPredictionById = (propId) => {
              const prop = state.properties.find((p) => p.id === propId);
              if (!prop) return;
              state.tenant.hostelQuery = prop.name;
              state.tenant.isDropdownOpen = false;
              state.tenant.expandedPropertyId = prop.id;
              if (state.tenantProfile && !prop.location.toLowerCase().includes(activeLocation.toLowerCase())) {
                state.tenantProfile = { ...state.tenantProfile, preferredLocation: prop.location };
                state.tenant.formValues.preferredLocation = prop.location;
                saveTenantProfile(state.tenantProfile);
              }
              render();
            };

            searchInput?.addEventListener('focus', () => {
              state.tenant.isDropdownOpen = true;
              updatePredictiveUiOnly();
            });

            searchInput?.addEventListener('input', (e) => {
              state.tenant.hostelQuery = e.target.value;
              state.tenant.isDropdownOpen = true;
              state.tenant.highlightedIndex = 0;
              updatePredictiveUiOnly();
            });

            searchInput?.addEventListener('keydown', (e) => {
              const suggestions = getPredictiveSuggestions(state.tenant.hostelQuery, activeLocation, state.tenant.activeCategory);
              const inlinePred = getInlinePrediction(state.tenant.hostelQuery, suggestions);

              if ((e.key === 'Tab' || e.key === 'ArrowRight') && inlinePred && inlinePred !== state.tenant.hostelQuery) {
                if (searchInput.selectionStart === state.tenant.hostelQuery.length) {
                  e.preventDefault();
                  state.tenant.hostelQuery = inlinePred;
                  searchInput.value = inlinePred;
                  updatePredictiveUiOnly();
                  return;
                }
              }
              if (!state.tenant.isDropdownOpen || suggestions.length === 0) return;

              if (e.key === 'ArrowDown') {
                e.preventDefault();
                state.tenant.highlightedIndex = (state.tenant.highlightedIndex + 1) % suggestions.length;
                updatePredictiveUiOnly();
              } else if (e.key === 'ArrowUp') {
                e.preventDefault();
                state.tenant.highlightedIndex = (state.tenant.highlightedIndex - 1 + suggestions.length) % suggestions.length;
                updatePredictiveUiOnly();
              } else if (e.key === 'Enter') {
                e.preventDefault();
                const chosen = suggestions[state.tenant.highlightedIndex] || suggestions[0];
                if (chosen) selectPredictionById(chosen.id);
              } else if (e.key === 'Escape') {
                state.tenant.isDropdownOpen = false;
                updatePredictiveUiOnly();
              }
            });

            dropdown?.addEventListener('mousedown', (e) => {
              const li = e.target.closest('[data-select-prediction]');
              if (li) {
                e.preventDefault();
                selectPredictionById(li.getAttribute('data-select-prediction'));
              }
            });

            document.getElementById('clear-search-btn')?.addEventListener('click', () => {
              state.tenant.hostelQuery = '';
              state.tenant.isDropdownOpen = false;
              if (searchInput) searchInput.value = '';
              updatePredictiveUiOnly();
              searchInput?.focus();
            });

            // Delegated events inside tenant results section (works seamlessly after live typing!)
            const resultsSection = document.getElementById('tenant-results-section');
            resultsSection?.addEventListener('click', (e) => {
              const resetEmpty = e.target.closest('#empty-reset-filters-btn');
              if (resetEmpty) {
                resetTenantFilters();
                return;
              }

              const clearEmpty = e.target.closest('#empty-clear-search-btn');
              if (clearEmpty) {
                state.tenant.hostelQuery = '';
                if (searchInput) searchInput.value = '';
                updatePredictiveUiOnly();
                return;
              }

              const quickLocBtn = e.target.closest('[data-quick-location]');
              if (quickLocBtn) {
                const loc = quickLocBtn.getAttribute('data-quick-location');
                state.tenant.formValues.preferredLocation = loc;
                state.tenant.hostelQuery = '';
                state.tenant.expandedPropertyId = null;
                if (state.tenantProfile) {
                  state.tenantProfile = { ...state.tenantProfile, preferredLocation: loc };
                  saveTenantProfile(state.tenantProfile);
                }
                render();
                return;
              }

              const toggleBtn = e.target.closest('[data-toggle-property]');
              if (toggleBtn) {
                const propId = toggleBtn.getAttribute('data-toggle-property');
                state.tenant.expandedPropertyId = state.tenant.expandedPropertyId === propId ? null : propId;
                resultsSection.innerHTML = renderTenantResultsHtml();
                return;
              }

              const roomBtn = e.target.closest('[data-open-room-detail]');
              if (roomBtn) {
                const [propertyId, floorId, roomId] = roomBtn.getAttribute('data-open-room-detail').split('::');
                triggerRoomClickAnimation(roomBtn, e, () => {
                  state.tenant.selectedRoomCtx = { propertyId, floorId, roomId };
                  state.tenant.activeImageIdx = 0;
                  state.tenant.showContactPanel = false;
                  state.tenant.copiedPhone = false;
                  renderModal();
                });
              }
            });

            updatePredictiveUiOnly();
            bindTenantSupportHubEvents(main);
          }
        }

        // =========================================================================
        // 11B. LANDLORD AI AGENT, NOTIFICATIONS, NOTICES, COMPLAINTS & MAPS EVENTS
        // =========================================================================
        async function sendLandlordAiMessage(promptText, overrideMode) {
          const text = String(promptText || '').trim();
          if (!text || state.landlord.aiLoading) return;
          if (overrideMode) state.landlord.aiMode = overrideMode;

          const activeMode = state.landlord.aiMode;
          state.landlord.aiMessages.push({
            role: 'user',
            mode: activeMode,
            text,
            groundingLinks: [],
          });
          state.landlord.aiInput = '';
          state.landlord.aiError = '';
          state.landlord.aiLoading = true;
          render();

          const scrollThread = () => {
            const thread = document.getElementById('landlord-ai-thread');
            if (thread) thread.scrollTop = thread.scrollHeight;
          };
          scrollThread();

          try {
            const center = getCoordsForLocation(state.landlord.draft.location);
            const res = await fetch('/api/ai/landlord-agent', {
              method: 'POST',
              credentials: 'include',
              headers: getAuthHeaders({ 'Content-Type': 'application/json' }),
              body: JSON.stringify({
                mode: activeMode,
                messages: state.landlord.aiMessages.map((m) => ({ role: m.role, text: m.text })),
                context: buildLandlordAiContext(),
                userLocation: center,
              }),
            });
            const data = await res.json();
            if (!res.ok) {
              throw new Error(data?.error || 'Could not reach the StayGrid Landlord AI Agent.');
            }
            state.landlord.aiMessages.push({
              role: 'model',
              mode: activeMode,
              text: data.reply || 'No response received.',
              groundingLinks: Array.isArray(data.groundingLinks) ? data.groundingLinks : [],
            });
          } catch (err) {
            state.landlord.aiError =
              err?.message || 'Unable to contact the Gemini AI server. Make sure the StayGrid server is running.';
          } finally {
            state.landlord.aiLoading = false;
            render();
            scrollThread();
          }
        }

        function bindLandlordOpsHubEvents(main) {
          // AI Mode Tabs
          main.querySelectorAll('[data-landlord-ai-mode]').forEach((btn) => {
            btn.addEventListener('click', () => {
              state.landlord.aiMode = btn.getAttribute('data-landlord-ai-mode') || 'ops';
              state.landlord.aiError = '';
              render();
            });
          });

          // Quick AI Prompts
          main.querySelectorAll('[data-landlord-ai-quick]').forEach((btn) => {
            btn.addEventListener('click', () => {
              const prompt = btn.getAttribute('data-landlord-ai-quick') || '';
              const mode = btn.getAttribute('data-landlord-ai-quick-mode') || 'ops';
              void sendLandlordAiMessage(prompt, mode);
            });
          });

          const aiInputEl = main.querySelector('#landlord-ai-input');
          if (aiInputEl) {
            aiInputEl.addEventListener('input', (e) => {
              state.landlord.aiInput = e.target.value;
            });
          }

          main.querySelector('#landlord-ai-form')?.addEventListener('submit', (e) => {
            e.preventDefault();
            const val = aiInputEl ? aiInputEl.value : state.landlord.aiInput;
            void sendLandlordAiMessage(val);
          });

          // Notification Dismiss & Mark All Read
          main.querySelector('#mark-all-notifs-read-btn')?.addEventListener('click', () => {
            state.notifications = (state.notifications || []).map((n) => ({ ...n, read: true }));
            saveNotifications(state.notifications);
            render();
            showToast('Notifications cleared', 'All landlord alerts marked as read.', 'info');
          });

          main.querySelectorAll('[data-dismiss-notif]').forEach((btn) => {
            btn.addEventListener('click', () => {
              const id = btn.getAttribute('data-dismiss-notif');
              state.notifications = (state.notifications || []).map((n) =>
                n.id === id ? { ...n, read: true } : n
              );
              saveNotifications(state.notifications);
              render();
            });
          });

          // Complaint Status Update & Reply
          main.querySelectorAll('[data-complaint-status]').forEach((sel) => {
            sel.addEventListener('change', (e) => {
              const id = sel.getAttribute('data-complaint-status');
              const nextStatus = e.target.value;
              state.complaints = (state.complaints || []).map((c) =>
                c.id === id ? { ...c, status: nextStatus } : c
              );
              saveComplaints(state.complaints);
              // Also mark linked notification read
              state.notifications = (state.notifications || []).map((n) =>
                n.complaintId === id ? { ...n, read: true } : n
              );
              saveNotifications(state.notifications);
              render();
              showToast('Complaint status updated', `Marked as ${nextStatus}.`, 'success');
            });
          });

          main.querySelectorAll('[data-save-complaint-reply]').forEach((btn) => {
            btn.addEventListener('click', () => {
              const id = btn.getAttribute('data-save-complaint-reply');
              const input = main.querySelector(`[data-complaint-reply-input="${CSS.escape(id)}"]`);
              const replyText = (input?.value || '').trim();
              if (!replyText) {
                showToast('Write a reply first', 'Enter a short message or technician ETA for the tenant.', 'error');
                return;
              }
              state.complaints = (state.complaints || []).map((c) =>
                c.id === id
                  ? { ...c, landlordReply: replyText, status: c.status === 'Pending' ? 'In Progress' : c.status }
                  : c
              );
              saveComplaints(state.complaints);
              state.notifications = (state.notifications || []).map((n) =>
                n.complaintId === id ? { ...n, read: true } : n
              );
              saveNotifications(state.notifications);
              render();
              showToast('Reply sent to tenant', 'Your maintenance update is now visible in the Tenant Portal.', 'success');
            });
          });

          // Landlord Notice Board Form & Delete
          const noticeFormEl = main.querySelector('#landlord-notice-form');
          if (noticeFormEl) {
            noticeFormEl.querySelectorAll('input, select, textarea').forEach((field) => {
              field.addEventListener('input', (e) => {
                state.landlord.noticeForm[e.target.name] = e.target.value;
              });
              field.addEventListener('change', (e) => {
                state.landlord.noticeForm[e.target.name] = e.target.value;
              });
            });

            noticeFormEl.addEventListener('submit', (e) => {
              e.preventDefault();
              const nf = state.landlord.noticeForm;
              const title = (nf.title || '').trim();
              const message = (nf.message || '').trim();
              if (!title || !message) {
                state.landlord.noticeError = 'Please enter both a notice headline and notice message.';
                render();
                return;
              }
              const targetProp =
                nf.propertyId === 'all'
                  ? null
                  : state.properties.find((p) => p.id === nf.propertyId);
              const newNotice = {
                id: `not-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
                propertyId: targetProp ? targetProp.id : 'all',
                propertyName: targetProp ? targetProp.name : 'All StayGrid Properties',
                title,
                category: nf.category || 'Event / General',
                priority: nf.priority || 'Important',
                message,
                postedBy: state.landlord.draft.owner?.name?.trim() || 'Property Owner',
                createdAt: new Date().toISOString(),
              };
              state.notices.unshift(newNotice);
              saveNotices(state.notices);
              state.landlord.noticeForm = {
                propertyId: nf.propertyId,
                title: '',
                category: 'Rent Reminder',
                priority: 'Important',
                message: '',
              };
              state.landlord.noticeError = '';
              render();
              showToast('Notice published', `"${title}" is now visible in the Tenant Notice Board.`, 'success');
            });
          }

          main.querySelectorAll('[data-delete-notice]').forEach((btn) => {
            btn.addEventListener('click', () => {
              const id = btn.getAttribute('data-delete-notice');
              state.notices = (state.notices || []).filter((n) => n.id !== id);
              saveNotices(state.notices);
              render();
              showToast('Notice deleted', 'Removed from the notice board.', 'info');
            });
          });

          // Landlord Interactive Google Map (uses exact deployed pin coordinates if set)
          const landlordLoc = state.landlord.draft.location || 'Koramangala, Bengaluru';
          const landlordCenter = getPropertyCoords(state.landlord.draft);
          void StayGridMaps.mountMap('landlord-google-map', landlordCenter, [
            {
              position: landlordCenter,
              title: state.landlord.draft.name || 'Your Property',
              badge: (state.landlord.draft.name || 'Property').slice(0, 20),
              subtitle: state.landlord.draft.formattedAddress || landlordLoc,
            },
          ]);

          main.querySelectorAll('[data-landlord-map-search]').forEach((btn) => {
            btn.addEventListener('click', async () => {
              const query = btn.getAttribute('data-landlord-map-search') || '';
              state.landlord.mapLoading = true;
              state.landlord.mapError = '';
              state.landlord.mapQueryLabel = query;
              render();
              const res = await StayGridMaps.searchNearbyPlaces(
                'landlord-google-map',
                query,
                landlordLoc,
                landlordCenter
              );
              state.landlord.mapLoading = false;
              state.landlord.mapPlaces = res.places;
              state.landlord.mapError = res.error;
              render();
              // Re-run search pins onto the freshly mounted map after render
              if (res.places.length > 0) {
                window.setTimeout(() => {
                  void StayGridMaps.searchNearbyPlaces('landlord-google-map', query, landlordLoc, landlordCenter);
                }, 80);
              }
            });
          });
        }

        function bindTenantSupportHubEvents(main) {
          // Tenant Notice Board filter
          main.querySelector('#tenant-notice-filter')?.addEventListener('change', (e) => {
            state.tenant.noticeFilter = e.target.value;
            render();
          });

          // Quick Complaint Letter Templates
          main.querySelectorAll('[data-complaint-template]').forEach((btn) => {
            btn.addEventListener('click', () => {
              state.tenant.complaintForm.category = btn.getAttribute('data-tpl-cat') || 'Plumbing / Water';
              state.tenant.complaintForm.urgency = btn.getAttribute('data-tpl-urg') || 'Medium';
              state.tenant.complaintForm.subject = btn.getAttribute('data-tpl-subj') || '';
              state.tenant.complaintForm.letterBody = btn.getAttribute('data-tpl-body') || '';
              state.tenant.complaintErrors = {};
              render();
            });
          });

          // Complaint Letter Form field bindings
          const cmpFormEl = main.querySelector('#tenant-complaint-form');
          if (cmpFormEl) {
            cmpFormEl.querySelector('#cmp-property-select')?.addEventListener('change', (e) => {
              const propId = e.target.value;
              const prop = state.properties.find((p) => p.id === propId);
              state.tenant.complaintForm.propertyId = propId;
              state.tenant.complaintForm.roomLabel = prop?.floors?.[0]?.rooms?.[0]?.label || '';
              render();
            });

            cmpFormEl.querySelectorAll('input, select, textarea').forEach((field) => {
              if (field.id === 'cmp-property-select') return;
              const handler = (e) => {
                state.tenant.complaintForm[e.target.name] = e.target.value;
              };
              field.addEventListener('input', handler);
              field.addEventListener('change', handler);
            });

            main.querySelector('#toggle-complaint-preview-btn')?.addEventListener('click', () => {
              state.tenant.showComplaintPreview = !state.tenant.showComplaintPreview;
              render();
            });

            cmpFormEl.addEventListener('submit', async (e) => {
              e.preventDefault();
              if (state.tenant.complaintSubmitting) return;

              const cf = state.tenant.complaintForm;
              const prop = state.properties.find((p) => p.id === cf.propertyId) || state.properties[0];
              const tenantName = (cf.tenantName || state.tenantProfile?.fullName || '').trim();
              const tenantPhone = (cf.tenantPhone || state.tenantProfile?.phone || '').trim();
              const tenantEmail = (cf.tenantEmail || state.tenantProfile?.email || '').trim();
              const subject = (cf.subject || '').trim();
              const letterBody = (cf.letterBody || '').trim();

              const errs = {};
              if (!tenantName) errs.tenantName = 'Please enter your full name.';
              if (!subject) errs.subject = 'Please enter a subject for your complaint letter.';
              if (letterBody.length < 10) errs.letterBody = 'Please describe the maintenance issue in detail.';

              if (Object.keys(errs).length > 0) {
                state.tenant.complaintErrors = errs;
                render();
                showToast('Complete complaint letter fields', 'Please fill in the highlighted fields.', 'error');
                return;
              }

              state.tenant.complaintErrors = {};
              state.tenant.complaintSubmitting = true;
              render();

              const roomLabel = cf.roomLabel || prop?.floors?.[0]?.rooms?.[0]?.label || 'General';
              let matchedRoomId = '';
              if (prop) {
                for (const fl of prop.floors || []) {
                  const found = (fl.rooms || []).find((r) => r.label === roomLabel);
                  if (found) {
                    matchedRoomId = found.id;
                    break;
                  }
                }
              }

              const newComplaint = {
                id: `cmp-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
                propertyId: prop?.id || '',
                propertyName: prop?.name || 'StayGrid Property',
                roomId: matchedRoomId,
                roomLabel,
                tenantName,
                tenantPhone,
                tenantEmail,
                category: cf.category || 'Plumbing / Water',
                urgency: cf.urgency || 'Medium',
                subject,
                letterBody,
                status: 'Pending',
                createdAt: new Date().toISOString(),
                landlordReply: '',
                aiTriage: null,
              };

              // Call fast Gemini AI Triage to enrich Landlord notification alert
              try {
                const res = await fetch('/api/ai/complaint-alert', {
                  method: 'POST',
                  credentials: 'include',
                  headers: getAuthHeaders({ 'Content-Type': 'application/json' }),
                  body: JSON.stringify({ complaint: newComplaint }),
                });
                if (res.ok) {
                  const data = await res.json();
                  if (data?.triage) {
                    newComplaint.aiTriage = data.triage;
                  }
                }
              } catch {}

              state.complaints.unshift(newComplaint);
              saveComplaints(state.complaints);

              // Create live unread Landlord Notification immediately
              const newNotif = {
                id: `notif-${Date.now()}-${Math.random().toString(36).slice(2, 6)}`,
                type: 'complaint',
                complaintId: newComplaint.id,
                propertyId: newComplaint.propertyId,
                propertyName: newComplaint.propertyName,
                roomLabel: newComplaint.roomLabel,
                title: `New ${newComplaint.aiTriage?.priority || newComplaint.urgency} Maintenance Complaint — ${newComplaint.roomLabel}`,
                message: `${newComplaint.tenantName} filed a complaint letter: "${newComplaint.subject}".`,
                aiHeadline: newComplaint.aiTriage?.alertHeadline || '',
                aiAction: newComplaint.aiTriage?.recommendedAction || '',
                read: false,
                createdAt: new Date().toISOString(),
              };
              state.notifications.unshift(newNotif);
              saveNotifications(state.notifications);

              // Reset composer
              state.tenant.complaintForm.subject = '';
              state.tenant.complaintForm.letterBody = '';
              state.tenant.showComplaintPreview = false;
              state.tenant.complaintSubmitting = false;
              render();
              showToast(
                'Complaint letter submitted',
                `Landlord of ${newComplaint.propertyName} has been notified immediately.`,
                'success'
              );
            });
          }

          // Tenant Interactive Google Map + Places API (New) (uses pinned coordinates when set)
          const activeLoc =
            (state.tenantProfile?.preferredLocation || state.tenant.formValues.preferredLocation || '').trim() ||
            'Koramangala, Bengaluru';
          const tenantCenter = isValidCoords(state.tenantProfile?.preferredCoords)
            ? state.tenantProfile.preferredCoords
            : getCoordsForLocation(activeLoc);
          const displayedProps = getTenantDisplayedProperties();
          const propPins = displayedProps.slice(0, 6).map((p, idx) => {
            const hasExactPin = isValidCoords(p.coords);
            const c = getPropertyCoords(p);
            const offset = hasExactPin ? 0 : idx * 0.0018;
            return {
              position: { lat: c.lat + (idx % 2 === 0 ? offset : -offset * 0.7), lng: c.lng + offset * 0.8 },
              title: p.name,
              badge: p.name.slice(0, 18),
              subtitle: `${p.formattedAddress || p.location} · ${getPropertyStats(p).availableRooms} available`,
            };
          });
          void StayGridMaps.mountMap('tenant-google-map', tenantCenter, propPins);

          main.querySelectorAll('[data-tenant-map-search]').forEach((btn) => {
            btn.addEventListener('click', async () => {
              const query = btn.getAttribute('data-tenant-map-search') || '';
              state.tenant.mapLoading = true;
              state.tenant.mapError = '';
              state.tenant.mapQueryLabel = query;
              render();
              const res = await StayGridMaps.searchNearbyPlaces(
                'tenant-google-map',
                query,
                activeLoc,
                tenantCenter
              );
              state.tenant.mapLoading = false;
              state.tenant.mapPlaces = res.places;
              state.tenant.mapError = res.error;
              render();
              if (res.places.length > 0) {
                window.setTimeout(() => {
                  void StayGridMaps.searchNearbyPlaces('tenant-google-map', query, activeLoc, tenantCenter);
                }, 80);
              }
            });
          });

          // Tenant Gemini Maps & Search Grounding Area AI
          main.querySelectorAll('[data-neighborhood-mode]').forEach((btn) => {
            btn.addEventListener('click', () => {
              state.tenant.neighborhoodMode = btn.getAttribute('data-neighborhood-mode') || 'maps';
              state.tenant.neighborhoodError = '';
              render();
            });
          });

          const nhInput = main.querySelector('#tenant-neighborhood-ai-input');
          if (nhInput) {
            nhInput.addEventListener('input', (e) => {
              state.tenant.neighborhoodQuery = e.target.value;
            });
          }

          main.querySelector('#tenant-neighborhood-ai-form')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const query = (nhInput?.value || state.tenant.neighborhoodQuery || '').trim();
            if (!query || state.tenant.neighborhoodLoading) return;

            state.tenant.neighborhoodLoading = true;
            state.tenant.neighborhoodError = '';
            render();

            try {
              const res = await fetch('/api/ai/neighborhood-guide', {
                method: 'POST',
                credentials: 'include',
                headers: getAuthHeaders({ 'Content-Type': 'application/json' }),
                body: JSON.stringify({
                  query,
                  locationName: activeLoc,
                  mode: state.tenant.neighborhoodMode,
                  latLng: tenantCenter,
                }),
              });
              const data = await res.json();
              if (!res.ok) {
                throw new Error(data?.error || 'Could not fetch neighborhood guide.');
              }
              state.tenant.neighborhoodResult = {
                answer: data.answer || '',
                groundingLinks: Array.isArray(data.groundingLinks) ? data.groundingLinks : [],
              };
            } catch (err) {
              state.tenant.neighborhoodError =
                err?.message || 'Unable to reach Gemini AI right now. Make sure the StayGrid server is running.';
            } finally {
              state.tenant.neighborhoodLoading = false;
              render();
            }
          });
        }

        // =========================================================================
        // 12. MASTER RENDER & GLOBAL LISTENERS
        // =========================================================================
        function render() {
          updateNavActiveStyles();
          const main = document.getElementById('main-content');
          if (!state.auth.user || !authToken) {
            main.innerHTML = renderAuthGate();
            bindMainEvents();
            renderModal();
            return;
          }
          if (state.role === 'landing') {
            main.innerHTML = renderLanding();
          } else if (state.role === 'landlord') {
            main.innerHTML = renderLandlord();
          } else {
            main.innerHTML = renderTenant();
          }
          bindMainEvents();
          renderModal();
        }

        // =========================================================================
        // 13. WELCOME SPLASH CONTROLLER (INNER ENTRANCE & OUTER EXIT EFFECTS)
        // =========================================================================
        let welcomeAutoTimer = null;
        let welcomeCleanupTimer = null;

        function dismissWelcomeSplash() {
          const splash = document.getElementById('welcome-splash');
          const appEl = document.getElementById('app');
          if (!splash || splash.classList.contains('hidden') || splash.classList.contains('is-exiting')) {
            return;
          }
          if (welcomeAutoTimer) {
            window.clearTimeout(welcomeAutoTimer);
            welcomeAutoTimer = null;
          }
          splash.classList.add('is-exiting');
          if (appEl) {
            appEl.classList.remove('app-reveal-settle');
            void appEl.offsetWidth;
            appEl.classList.add('app-reveal-settle');
          }
          welcomeCleanupTimer = window.setTimeout(() => {
            splash.classList.add('hidden');
            splash.classList.remove('is-exiting');
          }, 760);
        }

        function playWelcomeSplash() {
          const splash = document.getElementById('welcome-splash');
          if (!splash) return;
          if (welcomeAutoTimer) window.clearTimeout(welcomeAutoTimer);
          if (welcomeCleanupTimer) window.clearTimeout(welcomeCleanupTimer);

          splash.classList.remove('hidden', 'is-exiting');
          // Restart inner entrance animations cleanly on replay
          const animatedNodes = splash.querySelectorAll(
            '.welcome-card-frame, .welcome-inner-img, .welcome-inner-sheen, .welcome-progress-bar'
          );
          animatedNodes.forEach((node) => {
            node.style.animation = 'none';
            void node.offsetWidth;
            node.style.animation = '';
          });

          welcomeAutoTimer = window.setTimeout(() => {
            dismissWelcomeSplash();
          }, 2800);
        }

        document.addEventListener('DOMContentLoaded', () => {
          document.getElementById('footer-copy').textContent = `© ${new Date().getFullYear()} StayGrid. Hostel & PG Management Platform.`;

          document.getElementById('enter-staygrid-btn')?.addEventListener('click', (e) => {
            e.stopPropagation();
            dismissWelcomeSplash();
          });
          document.getElementById('welcome-splash')?.addEventListener('click', () => {
            dismissWelcomeSplash();
          });
          document.getElementById('replay-welcome-btn')?.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
            playWelcomeSplash();
          });

          document.getElementById('nav-brand-btn')?.addEventListener('click', () => {
            if (state.auth.user && authToken) {
              setRole('landing');
            }
          });
          document.querySelectorAll('[data-nav-role]').forEach((btn) => {
            btn.addEventListener('click', () => setRole(btn.getAttribute('data-nav-role')));
          });

          document.getElementById('nav-signin-btn')?.addEventListener('click', () => {
            state.auth.mode = 'login';
            state.auth.error = '';
            state.auth.roleMismatchTarget = null;
            render();
          });

          document.getElementById('nav-register-btn')?.addEventListener('click', () => {
            state.auth.mode = 'register';
            state.auth.error = '';
            state.auth.roleMismatchTarget = null;
            render();
          });

          document.getElementById('nav-profile-btn')?.addEventListener('click', () => {
            if (!state.auth.user) return;
            state.auth.profileError = '';
            state.auth.profileModalOpen = true;
            renderModal();
          });

          document.getElementById('nav-logout-btn')?.addEventListener('click', () => {
            void handleAuthLogout();
          });

          document.getElementById('nav-notif-btn')?.addEventListener('click', () => {
            if (!state.auth.user || state.auth.user.role !== 'landlord') return;
            if (state.role !== 'landlord') {
              setRole('landlord');
            }
            window.setTimeout(() => {
              document.getElementById('landlord-notifications-section')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 100);
          });

          window.addEventListener('gmp-quota-exceeded', () => {
            const banner = document.getElementById('gmp-quota-banner');
            if (banner) banner.classList.remove('hidden');
          });

          document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
              const splash = document.getElementById('welcome-splash');
              if (splash && !splash.classList.contains('hidden')) {
                dismissWelcomeSplash();
                return;
              }
              if (state.landlord.editingRoomRef || state.tenant.selectedRoomCtx || state.auth.profileModalOpen) {
                closeModals();
              }
            }
          });

          document.addEventListener('mousedown', (e) => {
            const box = document.getElementById('predictive-search-box');
            if (box && !box.contains(e.target) && state.tenant.isDropdownOpen) {
              state.tenant.isDropdownOpen = false;
              updatePredictiveUiOnly();
            }
          });

          // Theme Mode Controller (Light Mode / Dark Mode)
          const THEME_STORAGE_KEY = 'staygrid_theme_v1';
          function applyThemeMode(mode, persist = true) {
            const next = mode === 'dark' ? 'dark' : 'light';
            document.documentElement.classList.toggle('theme-dark', next === 'dark');
            document.querySelectorAll('[data-set-theme]').forEach((btn) => {
              const btnMode = btn.getAttribute('data-set-theme');
              btn.setAttribute('aria-pressed', btnMode === next ? 'true' : 'false');
            });
            if (persist) {
              try {
                localStorage.setItem(THEME_STORAGE_KEY, next);
              } catch {}
            }
            if (state.role === 'landlord') {
              renderOrUpdateOccupancyChart();
            }
          }

          let savedTheme = 'light';
          try {
            savedTheme = localStorage.getItem(THEME_STORAGE_KEY) === 'dark' ? 'dark' : 'light';
          } catch {}
          applyThemeMode(savedTheme, false);

          document.querySelectorAll('[data-set-theme]').forEach((btn) => {
            btn.addEventListener('click', () => {
              const targetMode = btn.getAttribute('data-set-theme') === 'dark' ? 'dark' : 'light';
              applyThemeMode(targetMode, true);
              showToast(
                targetMode === 'dark' ? 'Dark Mode enabled' : 'Light Mode enabled',
                targetMode === 'dark'
                  ? 'Switched to Midnight Navy & Neon Cyan dark theme.'
                  : 'Switched to bright light theme.',
                'info'
              );
            });
          });

          window.addEventListener('storage', (e) => {
            if (e.key === THEME_STORAGE_KEY) {
              applyThemeMode(e.newValue === 'dark' ? 'dark' : 'light', false);
            } else if (e.key === STORAGE_KEYS.PROPERTIES) {
              state.properties = loadProperties();
              render();
            } else if (e.key === STORAGE_KEYS.TENANT_PROFILE) {
              state.tenantProfile = loadTenantProfile();
              render();
            } else if (e.key === STORAGE_KEYS.VISIT_REQUESTS) {
              state.visitRequests = loadVisitRequests();
              render();
            } else if (e.key === STORAGE_KEYS.COMPLAINTS) {
              state.complaints = loadComplaints();
              render();
            } else if (e.key === STORAGE_KEYS.NOTIFICATIONS) {
              state.notifications = loadNotifications();
              render();
            } else if (e.key === STORAGE_KEYS.REVIEWS) {
              state.reviews = loadReviews();
              render();
            } else if (e.key === STORAGE_KEYS.NOTICES) {
              state.notices = loadNotices();
              render();
            }
          });

          render();
          playWelcomeSplash();
        });
      })();
    </script>
  </body>
</html>
